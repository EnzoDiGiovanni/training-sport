# Développement local : application (image de production) + MySQL 8.
#   docker compose up -d --build
#   docker compose exec app php artisan db:seed --force          # utilisateur, exercices, programme
#   docker compose exec app php artisan db:seed --class=DemoHistorySeeder --force   # facultatif
services:
    app:
        build: .
        ports: ['${APP_PORT:-8080}:80']
        env_file: .env
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:${APP_PORT:-8080}
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: recompo
            DB_USERNAME: recompo
            DB_PASSWORD: recompo
        volumes:
            - storage:/app/storage
        depends_on:
            mysql:
                condition: service_healthy

    scheduler:
        build: .
        command: ['php', 'artisan', 'schedule:work']
        healthcheck:
            disable: true
        env_file: .env
        environment:
            RUN_MIGRATIONS: 'false'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_DATABASE: recompo
            DB_USERNAME: recompo
            DB_PASSWORD: recompo
        volumes:
            - storage:/app/storage
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: recompo
            MYSQL_USER: recompo
            MYSQL_PASSWORD: recompo
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    '127.0.0.1',
                    '-uroot',
                    '-proot',
                ]
            interval: 5s
            retries: 20

volumes:
    storage:
    mysql:
