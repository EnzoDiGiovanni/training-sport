            };
            function ic(name, cls = '') {
                return `<svg class="${cls}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[name] || ''}</svg>`;
            }

            /* ---------- Helpers ---------- */
            function escapeHtml(s) {
                return String(s == null ? '' : s).replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            '&': '&amp;',
                            '<': '&lt;',
                            '>': '&gt;',
                            '"': '&quot;',
                            "'": '&#39;',
                        })[c],
                );
            }
            const esc = escapeHtml;
            function fmt(n, d = 1) {
                if (n == null || isNaN(n)) return '–';
                return Number(n).toLocaleString('fr-FR', {
                    minimumFractionDigits: d,
                    maximumFractionDigits: d,
                });
            }
            function fmtInt(n) {
                return Math.round(n).toLocaleString('fr-FR');
            }
            function fmtDur(sec) {
                const m = Math.round(sec / 60);
                if (m < 60) return m + ' min';
                return (
                    Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0')
                );
            }
            function fmtClock(sec) {
                sec = Math.max(0, Math.round(sec));
                const h = Math.floor(sec / 3600),
                    m = Math.floor((sec % 3600) / 60),
                    s = sec % 60;
                return (
                    (h
                        ? h + ':' + String(m).padStart(2, '0')
                        : String(m).padStart(2, '0')) +
                    ':' +
                    String(s).padStart(2, '0')
                );
            }
            function parseClock(str) {
                if (!str) return 0;
                const p = String(str)
                    .trim()
                    .split(':')
                    .map((x) => parseFloat(x.replace(',', '.')));
                if (p.some(isNaN)) return NaN;
                if (p.length === 1) return p[0] * 60;
                if (p.length === 2) return p[0] * 60 + p[1];
                return p[0] * 3600 + p[1] * 60 + p[2];
            }
            function num(v) {
                if (v === '' || v == null) return NaN;
                return parseFloat(String(v).replace(',', '.'));
            }
            function dateLong(d) {
                d = new Date(d);
                return (
                    DAY_NAMES[dayIdx(d)].toLowerCase() +
                    ' ' +
                    d.getDate() +
                    ' ' +
                    MONTHS[d.getMonth()]
                );
            }
            function dateShort(d) {
                d = new Date(d);
                return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()];
            }
            function cap(s) {
                return s.charAt(0).toUpperCase() + s.slice(1);
            }
            function daysAgo(isoStr) {
                const n = Math.round((TODAY - parseIso(isoStr)) / 864e5);
                return n === 0
                    ? 'aujourd’hui'
                    : n === 1
                      ? 'hier'
                      : 'il y a ' + n + ' j';
            }
            function weekNumber(d) {
                d = new Date(
                    Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()),
                );
                const dn = d.getUTCDay() || 7;
                d.setUTCDate(d.getUTCDate() + 4 - dn);
                const y = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
                return Math.ceil(((d - y) / 864e5 + 1) / 7);
            }
            function uid(p) {
                return p + Math.random().toString(36).slice(2, 8);
            }
            function clone(o) {
                return JSON.parse(JSON.stringify(o));
            }

            const exById = (id) => S.exercises.find((e) => e.id === id);
            const wById = (id) => S.workouts.find((w) => w.id === id);
            const TYPE_LABEL = {
                run: 'Course',
                strength: 'Musculation',
                recovery: 'Récupération',
                rest: 'Repos',
            };
            const TYPE_ICON = {
                run: 'run',
                strength: 'dumbbell',
                recovery: 'leaf',
                rest: 'moon',
            };
            function typeChip(t) {
                return `<span class="chip chip-${t}">${ic(TYPE_ICON[t])}${TYPE_LABEL[t]}</span>`.replace(
                    '<svg class=""',
                    '<svg style="width:13px;height:13px"',
                );
            }
            const KIND_COLOR = {
                warm: '#5B6B8C',
                run: 'var(--run)',
                fast: 'var(--accent)',
                recover: '#6E86B5',
                cool: '#4A5468',
            };
            const KIND_LABEL = {
                warm: 'Échauffement',
                run: 'Course',
                fast: 'Accélération',
                recover: 'Récupération',
                cool: 'Retour au calme',
            };

            function flatSteps(w) {
                const out = [];
                (w.segments || []).forEach((s) => {
                    if (s.group) {
                        for (let i = 0; i < s.times; i++)
                            s.steps.forEach((st) =>
                                out.push(
                                    Object.assign(
                                        { cycle: i + 1, of: s.times },
                                        st,
                                    ),
                                ),
                            );
                    } else out.push(s);
                });
                return out;
            }
            function runMinutes(w) {
                return flatSteps(w).reduce((a, s) => a + (+s.min || 0), 0);
            }
            function plannedMinutes(w) {
                if (!w) return 0;
                if (w.type === 'run') return runMinutes(w);
                return w.duration || 0;
            }
            function durationLabel(w) {
                if (w.type === 'rest') return '–';
                if (w.type === 'recovery')
                    return 'Facultatif · ~' + (w.duration || 20) + ' min';
                return plannedMinutes(w) + ' min';
            }
            function speedLabel(s) {
                return (
                    (+s.vMin === +s.vMax
                        ? fmt(s.vMin, s.vMin % 1 ? 1 : 0)
                        : fmt(s.vMin, s.vMin % 1 ? 1 : 0) +
                          '–' +
                          fmt(s.vMax, s.vMax % 1 ? 1 : 0)) + ' km/h'
                );
            }
            function estRunKm(w) {
                return flatSteps(w).reduce(
                    (a, s) => a + (s.min / 60) * ((+s.vMin + +s.vMax) / 2),
                    0,
                );
            }
            function repsLabel(we, ex) {
                const unit = ex && ex.mode === 'time' ? ' s' : '';
                const r =
                    we.rMin === we.rMax ? we.rMin : we.rMin + '–' + we.rMax;
                return (
                    r +
                    unit +
                    (ex && ex.perSide
                        ? ex.mode === 'time'
                            ? ' / côté'
                            : ' / côté'
                        : '')
                );
            }
            function kgLabel(we, ex) {
                if (!ex || ex.bodyweight || !we.kg) return 'Poids du corps';
                return ex.factor === 2
                    ? '2 × ' + fmt(we.kg, we.kg % 1 ? 1 : 0) + ' kg'
                    : fmt(we.kg, we.kg % 1 ? 1 : 0) + ' kg';
            }
            function maxLoadFor(ex) {
                const p = S.profile;
                if (!ex || ex.bodyweight) return 0;
                if (ex.factor === 2) return p.dbMax;
                return p.dbCombine ? p.dbMax * 2 : p.dbMax;
            }

            function setVolume(set, ex) {
                if (!set.done || !ex || !ex.factor) return 0;
                return set.kg * set.reps * ex.factor * (ex.perSide ? 2 : 1);
            }
            function exVolume(item) {
                const ex = exById(item.exId) || item;
                return item.sets.reduce(
                    (a, s) =>
                        a +
                        setVolume(s, {
                            factor:
                                item.factor != null ? item.factor : ex.factor,
                            perSide: ex.perSide,
                        }),
                    0,
                );
            }
            function sessionVolume(s) {
                return (s.exercises || []).reduce((a, e) => a + exVolume(e), 0);
            }
            function sessionsSorted() {
                return S.sessions
                    .slice()
                    .sort((a, b) =>
                        a.date < b.date ? 1 : a.date > b.date ? -1 : 0,
                    );
            }
            function sessionOn(isoStr, wid) {
                return S.sessions.find(
                    (s) => s.date === isoStr && (!wid || s.workoutId === wid),
                );
            }
            function runAvg(s) {
                return s.run && s.durationSec
                    ? s.run.distance / (s.durationSec / 3600)
                    : NaN;
            }
            function kcalRun(s) {
                return s.run ? S.profile.weight * s.run.distance * 1.0 : 0;
            } // ≈ 1 kcal/kg/km
            function kcalStrength(sec) {
                return (4.5 * S.profile.weight * sec) / 3600;
            } // MET ≈ 4,5

            function weekStats(monday) {
                const a = iso(monday),
                    b = iso(addDays(monday, 7));
                const list = S.sessions.filter(
                    (s) => s.date >= a && s.date < b,
                );
                const trained = list.filter(
                    (s) => s.type === 'run' || s.type === 'strength',
                );
                return {
                    count: trained.length,
                    km: list.reduce(
                        (x, s) => x + (s.run ? s.run.distance : 0),
                        0,
                    ),
                    sec: list.reduce((x, s) => x + (s.durationSec || 0), 0),
                    list,
                };
            }
            function plannedPerWeek() {
                return S.schedule.filter((id) => {
                    const w = wById(id);
                    return w && (w.type === 'run' || w.type === 'strength');
                }).length;
            }

            function lastExercisePerf(exId, beforeIso) {
                const list = sessionsSorted().filter(
                    (s) => s.exercises && (!beforeIso || s.date < beforeIso),
                );
                for (const s of list) {
                    const it = s.exercises.find((e) => e.exId === exId);
                    if (it) return { session: s, item: it };
                }
                return null;
            }
            function exerciseHistory(exId) {
                return S.sessions
                    .filter(
                        (s) =>
                            s.exercises &&
                            s.exercises.some((e) => e.exId === exId),
                    )
                    .sort((a, b) => (a.date < b.date ? -1 : 1))
                    .map((s) => {
                        const it = s.exercises.find((e) => e.exId === exId);
                        const done = it.sets.filter((x) => x.done);
                        return {
                            date: s.date,
                            session: s,
                            item: it,
                            maxKg: Math.max(0, ...done.map((x) => x.kg)),
                            reps: done.reduce((a, x) => a + x.reps, 0),
                            vol: exVolume(it),
                        };
                    });
            }
            function setsSummary(item) {
                const ex = exById(item.exId);
                const done = item.sets.filter((s) => s.done);
                if (!done.length) return '–';
                const unit = ex && ex.mode === 'time' ? ' s' : '';
                const sameKg = done.every((s) => s.kg === done[0].kg);
                if (ex && ex.bodyweight)
                    return done.map((s) => s.reps + unit).join(' · ');
                if (sameKg)
                    return (
                        fmt(done[0].kg, done[0].kg % 1 ? 1 : 0) +
                        ' kg × ' +
                        done.map((s) => s.reps).join(', ')
                    );
                return done
                    .map((s) => fmt(s.kg, s.kg % 1 ? 1 : 0) + '×' + s.reps)
                    .join(' · ');
            }

            function toast(msg) {
                const t = document.getElementById('toast');
                t.innerHTML = `<div class="toast" role="status">${ic('check')}${esc(msg)}</div>`;
                clearTimeout(toast._t);
                toast._t = setTimeout(() => (t.innerHTML = ''), 2600);

            /* ---------- Navigation ---------- */

                        : '';
                document.getElementById('side').innerHTML = `
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0B0F00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-5 4 4 7-8"/></svg></span>Recompo</div>
    <nav class="nav" aria-label="Navigation principale">${items}</nav>
    ${live}
    <div class="side-foot">Prototype · données fictives<br>${esc(S.profile.name)} · ${S.profile.height} cm</div>`;

                Object.assign(UI, extra);

            /* ============================================================
   ACCUEIL
   ============================================================ */
            function dayStatus(d) {
                const monday = mondayOf(TODAY);
                const date = addDays(monday, d);
                const di = iso(date);
                const w = wById(S.schedule[d]);
                const t = w ? w.type : 'rest';
                const done = S.sessions.find(
                    (s) =>
                        s.date === di &&
                        (s.type === t || (w && s.workoutId === w.id)),
                );
                if (t === 'rest')
                    return { cls: 'is-rest', icon: 'moon', w, date, done };
                if (done)
                    return { cls: 'is-done', icon: 'check', w, date, done };
                if (t === 'recovery')
                    return {
                        cls:
                            date.getTime() === TODAY.getTime()
                                ? 'is-today'
                                : 'is-rest',
                        icon: 'leaf',
                        w,
                        date,
                    };
                if (date < TODAY)
                    return { cls: 'is-missed', icon: 'x', w, date };
                if (date.getTime() === TODAY.getTime())
                    return { cls: 'is-today', icon: TYPE_ICON[t], w, date };
                return { cls: '', icon: TYPE_ICON[t], w, date };
            }

            function viewHome() {
                const p = S.profile;
                const monday = mondayOf(TODAY);
                const d = UI.selDay;
                const st = dayStatus(d);
                const w = st.w;
                const isToday = d === dayIdx(TODAY);
                const ws = weekStats(monday),
                    prev = weekStats(addDays(monday, -7));
                const planned = plannedPerWeek();

                // carte principale
                let hero;
                const label = isToday
                    ? 'Aujourd’hui'
                    : st.date < TODAY
                      ? DAY_NAMES[d] + ' dernier'
                      : 'Aperçu · ' + DAY_NAMES[d] + ' ' + dateShort(st.date);
                if (!w || w.type === 'rest') {
                    hero = `<div class="card hero" style="grid-template-columns:1fr">
      <div class="hero-main" style="flex-direction:row;align-items:center;gap:24px;flex-wrap:wrap">

          <h2 class="title-l">Journée de récupération</h2>

        </div>
      </div></div>`;
                } else {
                    const done = st.done;
                    const cta = done
                        ? `<button class="btn btn-lg" data-a="openSession" data-id="${done.id}">${ic('check')}Séance terminée · voir le détail</button>`
                        : w.type === 'recovery'
                          ? `<button class="btn btn-primary btn-lg" data-a="logRecovery">${ic('plus')}Enregistrer une activité</button>`
                          : `<button class="btn btn-primary btn-lg" data-a="start" data-wid="${w.id}">${ic('play')}${isToday ? 'Commencer ma séance' : 'Commencer cette séance'}</button>`;
                    let meta = `<div class="meta-item"><span class="k">Durée estimée</span><span class="v num">${durationLabel(w)}</span></div>
      <div class="meta-item"><span class="k">Type</span><span class="v">${TYPE_LABEL[w.type]}</span></div>`;
                    if (w.type === 'run')
                        meta += `<div class="meta-item"><span class="k">Distance estimée</span><span class="v num">≈ ${fmt(estRunKm(w))} km</span></div>`;
                    if (w.type === 'strength')
                        meta += `<div class="meta-item"><span class="k">Exercices</span><span class="v num">${w.exercises.length} · ${w.exercises.reduce((a, e) => a + e.sets, 0)} séries</span></div>`;
                    let side = '';
                    if (w.type === 'strength') {
                        side = `<div class="row" style="justify-content:space-between"><span class="label">Au programme</span><button class="link" data-a="detail" data-wid="${w.id}">Détail</button></div>
        <div class="stack">${w.exercises
            .map((we) => {
                const ex = exById(we.exId);
                return `<button class="ex-row" data-a="exInfo" data-ex="${ex.id}">
          <span class="thumb">${exImage(ex, { animate: false, pose: 'B' })}</span>
          <span class="grow stack"><span class="nm">${esc(ex.name)}</span><span class="sub num">${we.sets} × ${repsLabel(we, ex)} · ${kgLabel(we, ex)}</span></span></button>`;
            })
            .join('')}</div>`;
                    } else if (w.type === 'run') {
                        side = `<div class="row" style="justify-content:space-between"><span class="label">Déroulé</span><button class="link" data-a="detail" data-wid="${w.id}">Détail</button></div>
        ${runTimeline(w)}
        <div class="seg-list">${w.segments
            .map((s) =>
                s.group
                    ? `<div class="seg-item"><span class="sw" style="background:var(--accent)"></span><span class="grow"><b style="font-weight:500">${s.times} cycles</b><br><span class="faint" style="font-size:12.5px">${s.steps.map((x) => x.min + ' min à ' + speedLabel(x)).join(' + ')}</span></span><span class="t">${s.times * s.steps.reduce((a, x) => a + x.min, 0)} min</span></div>`
                    : `<div class="seg-item"><span class="sw" style="background:${KIND_COLOR[s.kind]}"></span><span class="grow"><b style="font-weight:500">${esc(s.label)}</b><br><span class="faint num" style="font-size:12.5px">${speedLabel(s)}${s.incline ? ' · ' + fmt(s.incline, 0) + ' %' : ''}</span></span><span class="t">${s.min} min</span></div>`,
            )
            .join('')}</div>`;
                    } else {
                        side = `<div class="illo">${illoSvg('walk', { label: 'Marche' })}</div><p class="muted" style="font-size:13.5px">Marche tranquille, mobilité ou étirements légers. Aucune séance obligatoire.</p>`;
                    }
                    hero = `<div class="card hero">
      <div class="hero-main">
        <div class="row gap-8 wrapflex"><span class="eyebrow">${label}</span>${typeChip(w.type)}</div>
        <div class="stack gap-8"><h2 class="title-xl">${esc(w.name)}</h2><p class="muted" style="max-width:48ch">${esc(w.objective || '')}</p></div>
        <div class="hero-meta">${meta}</div>
        ${w.type === 'run' ? `<div class="illo" style="max-width:300px">${illoSvg('run', { label: 'Course sur tapis' })}</div>` : ''}
        <div class="row wrapflex" style="margin-top:auto">${cta}${!done && w.type !== 'recovery' ? `<button class="btn btn-lg btn-ghost" data-a="detail" data-wid="${w.id}">Voir le détail</button>` : ''}</div>
      </div>
      <div class="hero-side">${side}</div></div>`;
                }

                // semaine
                const days = DAY_SHORT.map((n, i) => {
                    const s = dayStatus(i);
                    const isT = i === dayIdx(TODAY);
                    return `<button class="day ${s.cls}${isT ? ' is-today' : ''}" data-a="selDay" data-d="${i}" aria-pressed="${i === d}" aria-label="${DAY_NAMES[i]} : ${s.w ? esc(s.w.name) : 'Repos'}">
      <span class="dname">${n}</span><span class="ring">${ic(s.icon)}</span><span class="dnum">${s.date.getDate()}</span><span class="dtype">${s.w ? (s.w.type === 'rest' ? 'Repos' : esc(s.w.name.replace('Musculation', 'Muscu'))) : 'Repos'}</span></button>`;
                }).join('');

                // stats
                const wts = S.weights
                    .slice()
                    .sort((a, b) => (a.date < b.date ? -1 : 1));
                const last = wts[wts.length - 1];
                const ref =
                    wts.find((x) => x.date >= iso(addDays(TODAY, -30))) ||
                    wts[0];
                const dW = last.kg - ref.kg;
                const kmGoal = p.goalKm;
                const stats = `
    <div class="card stat"><span class="k">${ic('check', '')}Séances</span><span class="v num">${ws.count}<small>/ ${planned}</small></span><div class="bar"><i style="width:${Math.min(100, (ws.count / planned) * 100)}%"></i></div><span class="d">Semaine dernière : ${prev.count}/${planned}</span></div>
    <div class="card stat"><span class="k">Kilomètres</span><span class="v num">${fmt(ws.km)}<small>km</small></span><div class="bar"><i style="width:${Math.min(100, (ws.km / kmGoal) * 100)}%"></i></div><span class="d">Objectif ${kmGoal} km · sem. dernière ${fmt(prev.km)} km</span></div>
    <div class="card stat"><span class="k">Temps d’entraînement</span><span class="v num">${ws.sec ? fmtDur(ws.sec).replace(' min', '<small>min</small>') : '0<small>min</small>'}</span><span class="d">Semaine dernière : ${fmtDur(prev.sec)}</span></div>
    <button class="card stat" data-a="nav" data-to="stats" data-tab="weight" style="text-align:left"><span class="k">Poids</span><span class="v num">${fmt(last.kg)}<small>kg</small></span>${sparkline(wts.slice(-12).map((x) => x.kg))}<span class="d"><span class="${dW <= 0 ? 'delta-good' : 'delta-bad'} num">${dW > 0 ? '+' : ''}${fmt(dW)} kg</span> sur 30 jours · cible ${fmt(p.targetWeight, 0)} kg</span></button>`;

                const recent = sessionsSorted().slice(0, 3);
                return `
  <div class="page-head"><div class="stack gap-4"><span class="eyebrow">${cap(dateLong(TODAY))} ${TODAY.getFullYear()} · semaine ${weekNumber(TODAY)}</span><h1 class="title-xl">Bonjour ${esc(p.name)}</h1></div></div>
  ${hero}
  <section class="section"><div class="section-head"><h2>Cette semaine</h2><span class="faint num" style="font-size:13px">${ws.count} / ${planned} séances réalisées</span></div><div class="week">${days}</div></section>
  <section class="section"><div class="section-head"><h2>Statistiques rapides</h2></div><div class="stats">${stats}</div></section>
  <section class="section"><div class="section-head"><h2>Dernières séances</h2><button class="link" data-a="nav" data-to="history">Tout voir</button></div>
    <div class="card">${recent.map(historyRow).join('')}</div></section>`;
            }

            function sparkline(vals) {
                if (vals.length < 2) return '';
                const w = 120,
                    h = 26,
                    mn = Math.min(...vals) - 0.2,
                    mx = Math.max(...vals) + 0.2;
                const pts = vals.map((v, i) => [
                    (i / (vals.length - 1)) * w,
                    h - ((v - mn) / (mx - mn)) * h,
                ]);
                const d = pts
                    .map(
                        (p, i) =>
                            (i ? 'L' : 'M') +
                            p[0].toFixed(1) +
                            ' ' +
                            p[1].toFixed(1),
                    )
                    .join(' ');
                const e = pts[pts.length - 1];
                return `<svg viewBox="-2 -3 ${w + 4} ${h + 6}" style="width:100%;height:26px" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${e[0]}" cy="${e[1]}" r="2.6" fill="var(--accent)"/></svg>`;
            }

            function runTimeline(w, markerMin) {
                const steps = flatSteps(w);
                const total = steps.reduce((a, s) => a + s.min, 0) || 1;
                const vMax = Math.max(10, ...steps.map((s) => s.vMax));
                const bars = steps
                    .map(
                        (s) =>
                            `<div style="flex:${s.min} 0 0" title="${esc(s.label)} · ${s.min} min · ${speedLabel(s)}"><i style="height:${Math.max(18, (s.vMax / vMax) * 100)}%;background:${KIND_COLOR[s.kind] || 'var(--run)'}"></i></div>`,
                    )
                    .join('');
                const marker =
                    markerMin != null
                        ? `<span style="position:absolute;top:-4px;bottom:-4px;left:${Math.min(100, (markerMin / total) * 100)}%;width:2px;background:var(--text);border-radius:2px"></span>`
                        : '';
                return `<div class="stack gap-4"><div style="position:relative"><div class="tl">${bars}</div>${marker}</div><div class="tl-legend"><span>0</span><span>${Math.round(total / 2)} min</span><span>${total} min</span></div></div>`;
            }

            /* ============================================================
   DÉTAIL D'UNE SÉANCE (programme)
   ============================================================ */
            function viewWorkout() {
                const w = wById(UI.wid);
                if (!w) return viewHome();
                const lastS = sessionsSorted().find(
                    (s) => s.workoutId === w.id,
                );
                const head = `<div class="stack gap-12">
    <div><button class="btn btn-ghost btn-sm" data-a="nav" data-to="home">${ic('back')}Accueil</button></div>
    <div class="page-head"><div class="stack gap-8"><div class="row gap-8">${typeChip(w.type)}<span class="faint num" style="font-size:13px">${durationLabel(w)}</span></div><h1 class="title-xl">${esc(w.name)}</h1><p class="muted" style="max-width:60ch">${esc(w.objective || '')}</p></div>
    <div class="row"><button class="btn" data-a="editWorkout" data-wid="${w.id}">${ic('edit')}Modifier</button>${w.type !== 'rest' && w.type !== 'recovery' ? `<button class="btn btn-primary" data-a="start" data-wid="${w.id}">${ic('play')}Commencer</button>` : ''}</div></div></div>`;
                if (w.type === 'run') {
                    const steps = w.segments;
                    return (
                        head +
                        `
    <div class="grid-2" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">
      <div class="card card-pad stack gap-16">
        <div class="section-head"><h2>Déroulé de la séance</h2><span class="faint num" style="font-size:13px">≈ ${fmt(estRunKm(w))} km</span></div>
        ${runTimeline(w)}
        <table class="sets" style="margin:0 -20px;width:calc(100% + 40px)"><thead><tr><th>Phase</th><th>Durée</th><th>Vitesse</th><th>Incl.</th></tr></thead><tbody>
        ${steps
            .map((s) =>
                s.group
                    ? `<tr><td colspan="4" style="text-align:left;padding-left:18px;color:var(--accent);font-size:13px;font-weight:500">Répéter ${s.times} fois</td></tr>` +
                      s.steps
                          .map(
                              (x) =>
                                  `<tr><td style="padding-left:30px">${esc(x.label)}</td><td class="num">${x.min} min</td><td class="num">${speedLabel(x)}</td><td class="num">${fmt(x.incline || 0, 0)} %</td></tr>`,
                          )
                          .join('')
                    : `<tr><td>${esc(s.label)}</td><td class="num">${s.min} min</td><td class="num">${speedLabel(s)}</td><td class="num">${fmt(s.incline || 0, 0)} %</td></tr>`,
            )
            .join('')}
        </tbody></table>
      </div>
      <div class="stack gap-16">
        <div class="illo">${illoSvg('run', { label: 'Course sur tapis' })}</div>
        <div class="card card-pad stack gap-12"><span class="label">Dernière fois</span>
        ${
            lastS
                ? `<div class="row" style="justify-content:space-between"><span class="muted">${cap(dateLong(lastS.date))}</span><span class="faint" style="font-size:12.5px">${daysAgo(lastS.date)}</span></div>
          <div class="grid-3"><div class="meta-item"><span class="k">Distance</span><span class="v num">${fmt(lastS.run.distance, 2)} km</span></div><div class="meta-item"><span class="k">Durée</span><span class="v num">${fmtClock(lastS.durationSec)}</span></div><div class="meta-item"><span class="k">Vit. moy.</span><span class="v num">${fmt(runAvg(lastS))}</span></div></div>`
                : '<p class="faint">Pas encore réalisée.</p>'
        }
        </div>
        <div class="notice">${ic('info')}<span>Tapis limité à ${S.profile.treadmillMax} km/h. Inclinaison conseillée : 1 % pour compenser l’absence de résistance de l’air, si c’est confortable.</span></div>
      </div>
    </div>`
                    );
                }
                if (w.type === 'strength') {
                    return (
                        head +
                        `<div class="w-grid">${w.exercises
                            .map((we, i) => {
                                const ex = exById(we.exId);
                                const lp = lastExercisePerf(ex.id);
                                return `<button class="card lib-card" data-a="exInfo" data-ex="${ex.id}">
        <div class="illo">${exImage(ex)}</div>
        <div class="body"><div class="row" style="justify-content:space-between"><span class="faint num" style="font-size:12px">${String(i + 1).padStart(2, '0')}</span><span class="faint" style="font-size:12px">Repos ${fmtClock(we.rest)}</span></div>
          <span style="font-weight:600;font-size:15px">${esc(ex.name)}</span><span class="faint" style="font-size:13px">${esc(ex.muscle)}</span>
          <span class="num" style="font-size:14px;margin-top:6px">${we.sets} × ${repsLabel(we, ex)} · ${kgLabel(we, ex)}</span>
          <span class="faint num" style="font-size:12.5px">${lp ? 'Dernière fois : ' + setsSummary(lp.item) : 'Pas encore réalisé'}</span></div></button>`;
                            })
                            .join('')}</div>`
                    );
                }
                return head;
            }
            /* ============================================================
   SÉANCE EN COURS (musculation + course) et RÉCAPITULATIF
   ============================================================ */
            function liveElapsed() {
                const L = S.live;
                if (!L) return 0;
                if (L.type === 'run') {
                    const c = L.chrono;
                    return (
                        (c.acc + (c.running ? Date.now() - c.startTs : 0)) /
                        1000
                    );
                }
                return (Date.now() - L.startedAt) / 1000;
            }

            function startWorkout(wid) {
                const w = wById(wid);
                if (!w) return;
                if (S.live && S.live.workoutId !== wid) {
                    openSheet(`<div class="sheet-head"><h3 class="grow title-m">Une séance est déjà en cours</h3></div>
      <div class="sheet-body"><p class="muted">« ${esc(S.live.name)} » n’est pas terminée. Tu peux la reprendre ou l’abandonner pour commencer « ${esc(w.name)} ».</p></div>
      <div class="sheet-foot"><button class="btn btn-danger" data-a="discardAndStart" data-wid="${wid}">Abandonner et commencer</button><button class="btn btn-primary" data-a="resume">Reprendre</button></div>`);
                    return;
                }
                if (!S.live) {
                    const sched = S.schedule.indexOf(wid);
                    const base = {
                        workoutId: w.id,
                        name: w.name,
                        type: w.type,
                        date: iso(TODAY),
                        startedAt: Date.now(),
                    };
                    if (w.type === 'strength') {
                        base.cur = 0;
                        base.exercises = w.exercises.map((we) => {
                            const ex = exById(we.exId);
                            const lp = lastExercisePerf(ex.id);
                            const prev = lp ? lp.item.sets : [];
                            const sets = Array.from(
                                { length: we.sets },
                                (_, i) => {
                                    const pv = prev[i] || prev[prev.length - 1];
                                    return {
                                        kg: ex.bodyweight
                                            ? 0
                                            : pv
                                              ? pv.kg
                                              : we.kg,
                                        reps: pv ? pv.reps : we.rMax,
                                        done: false,
                                    };
                                },
                            );
                            return {
                                exId: ex.id,
                                name: ex.name,
                                mode: ex.mode,
                                factor: ex.factor,
                                rMin: we.rMin,
                                rMax: we.rMax,
                                rest: we.rest,
                                targetKg: we.kg,
                                prev,
                                sets,
                                note: '',
                            };
                        });
                    } else {
                        base.chrono = { running: false, startTs: 0, acc: 0 };
                        base.form = {
                            dur: '',
                            dist: '',
                            max: '',
                            incline: String(
                                (
                                    flatSteps(w).find(
                                        (s) => s.kind === 'run',
                                    ) || {}
                                ).incline ?? '',
                            ),
                            cycles: String(
                                (w.segments.find((s) => s.group) || {}).times ||
                                    '',
                            ),
                            rpe: null,
                            comment: '',
                        };
                    }
                    S.live = base;
                    save();
                }
                go('live');
            }

            /* ---------- Musculation ---------- */
            function liveKpis() {
                const L = S.live;
                let done = 0,
                    total = 0,
                    vol = 0;
                L.exercises.forEach((e) => {
                    total += e.sets.length;
                    e.sets.forEach((s) => {
                        if (s.done) {
                            done++;
                        }
                    });
                    vol += exVolume(e);
                });
                return { done, total, vol };
            }
            function viewLive() {
                const L = S.live;
                if (!L) return viewHome();
                if (L.type === 'run') return viewLiveRun();
                const k = liveKpis();
                const nav = L.exercises
                    .map((e, i) => {
                        const complete = e.sets.every((s) => s.done);
                        return `<button data-a="jumpEx" data-i="${i}" class="${i === L.cur ? 'is-cur' : ''} ${complete ? 'is-complete' : ''}">${complete ? ic('check') : '<span class="num faint">' + (i + 1) + '</span>'}${esc(e.name.split(' ')[0])}</button>`;
                    })
                    .join('');
                const cards = L.exercises
                    .map((e, i) => liveExCard(e, i))
                    .join('');
                return `
  <div class="live-head"><div class="inner">
    <button class="btn btn-ghost btn-icon" data-a="nav" data-to="home" aria-label="Retour à l’accueil (la séance continue)">${ic('back')}</button>
    <div class="grow stack" style="min-width:140px"><span style="font-weight:600">${esc(L.name)}</span><span class="faint" style="font-size:12.5px">Séance en cours</span></div>
    <div class="live-kpis">
      <div class="stack"><span class="k">Durée</span><span class="v" data-live-clock>${fmtClock(liveElapsed())}</span></div>
      <div class="stack"><span class="k">Volume</span><span class="v" id="kVol">${fmtInt(k.vol)} kg</span></div>
      <div class="stack"><span class="k">Séries</span><span class="v" id="kSets">${k.done}/${k.total}</span></div>
    </div>
    <button class="btn btn-primary" data-a="finish">Terminer</button>
  </div>
  <div class="inner" style="margin-top:12px"><div class="ex-nav" id="exNav">${nav}</div></div></div>
  <div class="stack gap-16" style="margin-top:8px">${cards}</div>
  <div class="row" style="justify-content:center;padding:8px 0 40px"><button class="btn btn-primary btn-lg" data-a="finish">${ic('check')}Terminer la séance</button></div>`;
            }

            function liveExCard(e, i) {
                const ex = exById(e.exId) || {
                    name: e.name,
                    mode: e.mode,
                    factor: e.factor,
                };
                const isTime = e.mode === 'time';
                const bw = ex.bodyweight;
                const max = maxLoadFor(ex);
                const kgHead = bw
                    ? 'Charge'
                    : ex.factor === 2
                      ? 'kg / haltère'
                      : 'kg';
                const rows = e.sets
                    .map((s, j) => {
                        const pv = e.prev[j];
                        const pvTxt = pv
                            ? bw
                                ? pv.reps + (isTime ? ' s' : '')
                                : fmt(pv.kg, pv.kg % 1 ? 1 : 0) +
                                  ' × ' +
                                  pv.reps
                            : '–';
                        const over = !bw && max && s.kg > max;
                        return `<tr class="${s.done ? 'is-done' : ''}" data-row="${i}-${j}">
      <td><span class="set-num">${j + 1}</span></td>
      <td class="prev">${pvTxt}</td>
      <td>${bw ? '<span class="faint" style="font-size:13px">PDC</span>' : `<input class="cell-in ${over ? 'is-error' : ''}" style="${over ? 'border-color:var(--danger)' : ''}" inputmode="decimal" aria-label="Charge série ${j + 1}" data-in="set" data-e="${i}" data-s="${j}" data-f="kg" value="${fmt(s.kg, s.kg % 1 ? 1 : 0)}" title="${over ? 'Au-delà de ton matériel (' + max + ' kg max)' : ''}">`}</td>
      <td><input class="cell-in" inputmode="numeric" aria-label="${isTime ? 'Durée' : 'Répétitions'} série ${j + 1}" data-in="set" data-e="${i}" data-s="${j}" data-f="reps" value="${s.reps}"></td>
      <td><button class="check" data-a="toggleSet" data-e="${i}" data-s="${j}" aria-label="Valider la série ${j + 1}" aria-pressed="${s.done}">${ic('check')}</button></td></tr>`;
                    })
                    .join('');
                const lp = lastExercisePerf(e.exId);
                return `<article class="card ex-card ${i === S.live.cur ? 'is-cur' : ''}" id="ex-${i}">
    <div class="ex-top">
      <button class="illo" data-a="exInfo" data-ex="${e.exId}" aria-label="Voir les consignes : ${esc(e.name)}" style="padding:0">${exImage(ex)}</button>
      <div class="stack gap-8" style="min-width:0">
        <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="stack"><span class="faint num" style="font-size:12px">Exercice ${i + 1} / ${S.live.exercises.length}</span><h3 style="font-size:17px">${esc(e.name)}</h3></div>
          <button class="btn btn-ghost btn-icon" data-a="exHistory" data-ex="${e.exId}" aria-label="Performances précédentes">${ic('history')}</button></div>
        <span class="faint" style="font-size:13px">${esc(ex.muscle || '')}</span>
        <div class="row wrapflex gap-8"><span class="chip num">${e.sets.length} × ${e.rMin === e.rMax ? e.rMin : e.rMin + '–' + e.rMax}${isTime ? ' s' : ''}${ex.perSide ? ' / côté' : ''}</span><span class="chip num">${ic('clock').replace('class=""', 'style="width:12px;height:12px"')}Repos ${fmtClock(e.rest)}</span>${!bw ? `<span class="chip num">Cible ${kgLabel({ kg: e.targetKg }, ex)}</span>` : ''}</div>
        <span class="faint num" style="font-size:12.5px">${lp ? 'Dernière fois (' + daysAgo(lp.session.date) + ') : ' + setsSummary(lp.item) : 'Première fois sur cet exercice'}</span>
      </div>
    </div>
    <div style="overflow-x:auto"><table class="sets"><thead><tr><th>Série</th><th>Précédent</th><th>${kgHead}</th><th>${isTime ? 'Secondes' : 'Reps'}</th><th aria-label="Validée">${ic('check').replace('class=""', 'style="width:14px;height:14px;vertical-align:-2px"')}</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="ex-foot">
      <button class="btn btn-sm" data-a="addSet" data-e="${i}">${ic('plus')}Série</button>
      <button class="btn btn-sm btn-ghost" data-a="rmSet" data-e="${i}" ${e.sets.length <= 1 ? 'disabled' : ''}>${ic('minus')}Retirer</button>
      <input class="note-in" placeholder="Note (sensations, réglage du banc…)" aria-label="Note pour ${esc(e.name)}" data-in="note" data-e="${i}" value="${esc(e.note)}">
      ${i < S.live.exercises.length - 1 ? `<button class="btn btn-sm" data-a="jumpEx" data-i="${i + 1}">Exercice suivant${ic('next')}</button>` : ''}
    </div></article>`;
            }

            function refreshLiveBits() {
                if (!S.live || S.live.type !== 'strength') return;
                const k = liveKpis();
                const v = document.getElementById('kVol');
                if (v) v.textContent = fmtInt(k.vol) + ' kg';
                const st = document.getElementById('kSets');
                if (st) st.textContent = k.done + '/' + k.total;
                const nav = document.getElementById('exNav');
                if (nav) {
                    [...nav.children].forEach((b, i) => {
                        const e = S.live.exercises[i];
                        const c = e.sets.every((s) => s.done);
                        b.classList.toggle('is-complete', c);
                        b.classList.toggle('is-cur', i === S.live.cur);
                        b.innerHTML =
                            (c
                                ? ic('check')
                                : '<span class="num faint">' +
                                  (i + 1) +
                                  '</span>') + esc(e.name.split(' ')[0]);
                    });
                }
                document
                    .querySelectorAll('.ex-card')
                    .forEach((c, i) =>
                        c.classList.toggle('is-cur', i === S.live.cur),
                    );
            }

            /* ---------- Chrono de repos ---------- */
            function startRest(sec, label) {
                UI.rest = { end: Date.now() + sec * 1000, total: sec, label };
                renderRest();
            }
            function renderRest() {
                const el = document.getElementById('rest');
                if (!UI.rest || !S.live || UI.route !== 'live') {
                    el.innerHTML = '';
                    return;
                }
                const left = (UI.rest.end - Date.now()) / 1000;
                const over = left <= 0;
                el.innerHTML = `<div class="rest ${over ? 'is-over' : ''}" role="timer" aria-live="off">
    <div class="stack" style="min-width:0"><span class="faint" style="font-size:11.5px">${over ? 'Repos terminé' : 'Récupération'}</span><span class="clock" id="restClock" style="${over ? 'color:var(--accent)' : ''}">${over ? 'Go' : fmtClock(left)}</span></div>
    <div class="stack gap-8 grow" style="min-width:0"><span style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" class="muted">${esc(UI.rest.label)}</span><div class="bar"><i id="restBar" style="width:${Math.max(0, Math.min(100, (left / UI.rest.total) * 100))}%"></i></div></div>
    <button class="btn btn-sm btn-ghost" data-a="restAdj" data-v="-15">−15</button><button class="btn btn-sm btn-ghost" data-a="restAdj" data-v="15">+15</button>
    <button class="btn btn-sm" data-a="restSkip">${over ? 'Fermer' : 'Passer'}</button></div>`;
            }
            function tickRest() {
                if (!UI.rest) return;
                const left = (UI.rest.end - Date.now()) / 1000;
                const c = document.getElementById('restClock'),
                    b = document.getElementById('restBar');
                if (left <= 0 && c && c.textContent !== 'Go') {
                    renderRest();
                    return;
                }
                if (c && left > 0) c.textContent = fmtClock(left);
                if (b)
                    b.style.width =
                        Math.max(
                            0,
                            Math.min(100, (left / UI.rest.total) * 100),
                        ) + '%';
            }

            /* ---------- Course ---------- */
            function currentStep(w, elapsedMin) {
                const steps = flatSteps(w);
                let t = 0;
                for (let i = 0; i < steps.length; i++) {
                    if (elapsedMin < t + steps[i].min)
                        return {
                            step: steps[i],
                            idx: i,
                            left: (t + steps[i].min - elapsedMin) * 60,
                            next: steps[i + 1],
                        };
                    t += steps[i].min;
                }
                return { step: null, idx: steps.length, left: 0, next: null };
            }
            function runCalc(f) {
                const sec = parseClock(f.dur);
                const km = num(f.dist);
                const avg = sec > 0 && km > 0 ? km / (sec / 3600) : NaN;
                return { sec, km, avg };
            }
            function runErrors(f, w) {
                const e = {};
                const { sec, km, avg } = runCalc(f);
                const p = S.profile;
                if (!f.dur) e.dur = 'Indique la durée (ou utilise le chrono).';
                else if (isNaN(sec) || sec <= 0)
                    e.dur = 'Format attendu : mm:ss, par exemple 30:00.';
                if (!f.dist)
                    e.dist = 'Indique la distance affichée par le tapis.';
                else if (isNaN(km) || km <= 0) e.dist = 'Distance invalide.';
                if (!isNaN(avg) && avg > p.treadmillMax + 0.05)
                    e.dist =
                        'Vitesse moyenne de ' +
                        fmt(avg) +
                        ' km/h, supérieure au maximum du tapis (' +
                        p.treadmillMax +
                        ' km/h). Vérifie la distance ou la durée.';
                const mx = num(f.max);
                if (f.max && (isNaN(mx) || mx <= 0))
                    e.max = 'Vitesse invalide.';
                else if (mx > p.treadmillMax)
                    e.max =
                        'Ton tapis est limité à ' + p.treadmillMax + ' km/h.';
                else if (!isNaN(mx) && !isNaN(avg) && mx < avg - 0.05)
                    e.max =
                        'La vitesse max ne peut pas être inférieure à la moyenne (' +
                        fmt(avg) +
                        ').';
                const inc = num(f.incline);
                if (
                    f.incline &&
                    (isNaN(inc) || inc < 0 || inc > p.treadmillInclineMax)
                )
                    e.incline = 'Entre 0 et ' + p.treadmillInclineMax + ' %.';
                if (w.segments.some((s) => s.group)) {
                    const c = num(f.cycles);
                    const max = w.segments.find((s) => s.group).times;
                    if (f.cycles && (isNaN(c) || c < 0 || c > max + 5))
                        e.cycles = 'Nombre de cycles invalide.';
                }
                return e;
            }

            function viewLiveRun() {
                const L = S.live;
                const w = wById(L.workoutId) || { segments: [], name: L.name };
                const el = liveElapsed();
                const cs = currentStep(w, el / 60);
                const f = L.form;
                const c = runCalc(f);
                const hasGroup = w.segments.some((s) => s.group);
                const err = UI.runErrors || {};
                const kcal =
                    !isNaN(c.km) && c.km > 0 ? S.profile.weight * c.km : NaN;
                const stepBox = cs.step
                    ? `<div class="now-seg"><span class="sw" style="width:6px;height:44px;border-radius:3px;background:${KIND_COLOR[cs.step.kind]}"></span>
      <div class="grow stack"><span class="faint" style="font-size:12px">${cs.step.cycle ? 'Cycle ' + cs.step.cycle + ' / ' + cs.step.of + ' · ' : ''}Phase actuelle</span><span style="font-weight:600">${esc(cs.step.label)}</span><span class="faint num" style="font-size:12.5px">${cs.next ? 'Ensuite : ' + esc(cs.next.label) + ' à ' + speedLabel(cs.next) : 'Dernière phase'}</span></div>
      <div class="stack" style="align-items:flex-end"><span class="sp">${speedLabel(cs.step).replace(' km/h', '')}</span><span class="faint num" style="font-size:12px">km/h · reste <span data-step-left>${fmtClock(cs.left)}</span></span></div></div>`
                    : `<div class="now-seg"><div class="grow"><span style="font-weight:600">${el > 0 ? 'Programme terminé' : 'Prêt à démarrer'}</span><br><span class="faint" style="font-size:12.5px">${el > 0 ? 'Saisis les données affichées par le tapis puis enregistre.' : 'Lance le chrono quand tu démarres le tapis.'}</span></div></div>`;
                const field = (id, label, unit, val, extra = '') =>
                    `<div class="field"><label for="rf-${id}">${label}</label><div class="input-unit"><input id="rf-${id}" class="input num ${err[id] ? 'is-error' : ''}" inputmode="decimal" data-in="run" data-f="${id}" value="${esc(val)}" ${extra}><span>${unit}</span></div>${err[id] ? `<span class="err">${esc(err[id])}</span>` : ''}</div>`;
                return `
  <div class="live-head"><div class="inner">
    <button class="btn btn-ghost btn-icon" data-a="nav" data-to="home" aria-label="Retour à l’accueil (la séance continue)">${ic('back')}</button>
    <div class="grow stack"><span style="font-weight:600">${esc(L.name)}</span><span class="faint" style="font-size:12.5px">Course sur tapis · ${runMinutes(w)} min prévues</span></div>
    <button class="btn btn-ghost" data-a="discard">Abandonner</button>
  </div></div>
  <div class="grid-2" style="grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;margin-top:8px">
    <div class="card card-pad stack gap-20">
      <div class="stack gap-8" style="align-items:center;padding:12px 0 4px"><span class="faint" style="font-size:12.5px">Chronomètre</span><span class="chrono" data-live-clock>${fmtClock(el)}</span></div>
      <div class="row" style="justify-content:center">
        ${L.chrono.running ? `<button class="btn btn-lg" data-a="chrono" data-v="pause">${ic('pause')}Pause</button>` : `<button class="btn btn-primary btn-lg" data-a="chrono" data-v="start">${ic('play')}${el > 0 ? 'Reprendre' : 'Démarrer'}</button>`}
        <button class="btn btn-lg btn-ghost" data-a="chrono" data-v="reset" ${el > 0 ? '' : 'disabled'} aria-label="Remettre le chrono à zéro">${ic('reset')}</button>
      </div>
      <div id="stepBox">${stepBox}</div>
      <div id="runTl">${runTimeline(w, el / 60)}</div>
      <div class="illo" style="max-width:260px;align-self:center;width:100%">${illoSvg('run', { animate: L.chrono.running, label: 'Course sur tapis' })}</div>
    </div>
    <div class="card card-pad stack gap-16">
      <div class="section-head"><h2>Données de la séance</h2><span class="faint" style="font-size:12.5px">Relevées sur le tapis</span></div>
      <div class="field"><label for="rf-dur">Durée totale</label><div class="row gap-8"><div class="input-unit grow"><input id="rf-dur" class="input num ${err.dur ? 'is-error' : ''}" placeholder="mm:ss" data-in="run" data-f="dur" value="${esc(f.dur)}"><span>mm:ss</span></div><button class="btn" data-a="useChrono" ${el > 0 ? '' : 'disabled'}>Utiliser le chrono</button></div>${err.dur ? `<span class="err">${esc(err.dur)}</span>` : ''}</div>
      <div class="grid-2">${field('dist', 'Distance', 'km', f.dist, 'placeholder="4,25"')}
        <div class="field"><span class="label">Vitesse moyenne</span><div class="input num" style="display:flex;align-items:center;background:var(--surface-2);border-color:var(--border)" id="avgOut">${!isNaN(c.avg) ? fmt(c.avg, 2) + ' km/h' : '<span class="faint" style="font-size:13px">calculée automatiquement</span>'}</div></div></div>
      <div class="grid-2">${field('max', 'Vitesse max', 'km/h', f.max, 'placeholder="' + S.profile.treadmillMax + '"')}${field('incline', 'Inclinaison', '%', f.incline)}</div>
      ${hasGroup ? field('cycles', 'Cycles effectués', '/ ' + w.segments.find((s) => s.group).times, f.cycles) : ''}
      <div class="field"><span class="label">Ressenti</span>${ratingHtml(f.rpe, 'runRpe')}</div>
      <div class="field"><label for="rf-comment">Commentaire</label><textarea id="rf-comment" class="input" data-in="run" data-f="comment" placeholder="Sensations, fréquence cardiaque, conditions…">${esc(f.comment)}</textarea></div>
      <div class="notice" id="kcalOut">${ic('flame')}<span>${!isNaN(kcal) ? 'Dépense estimée : <b class="num">≈ ' + fmtInt(kcal) + ' kcal</b>. ' : ''}Estimation indicative (environ 1 kcal par kg et par km), marge d’erreur de ±20 % ou plus.</span></div>
      <button class="btn btn-primary btn-lg btn-block" data-a="saveRun">${ic('check')}Enregistrer la séance</button>
    </div>
  </div>`;
            }

            function ratingHtml(val, action) {
                const L = [
                    ['1', 'Très facile'],
                    ['2', 'Facile'],
                    ['3', 'Modéré'],
                    ['4', 'Difficile'],
                    ['5', 'Très dur'],
                ];
                return `<div class="rating" role="group" aria-label="Ressenti de 1 à 5">${L.map(([n, l]) => `<button type="button" data-a="${action}" data-v="${n}" aria-pressed="${String(val) === n}"><b>${n}</b>${l}</button>`).join('')}</div>`;
            }
            function rpeLabel(n) {
                return (
                    [
                        '',
                        'Très facile',
                        'Facile',
                        'Modéré',
                        'Difficile',
                        'Très dur',
                    ][n] || '–'
                );
            }

            function tickLive() {
                const t = fmtClock(liveElapsed());
                document
                    .querySelectorAll('[data-live-clock]')
                    .forEach((e) => (e.textContent = t));
                if (
                    S.live &&
                    S.live.type === 'run' &&
                    UI.route === 'live' &&
                    S.live.chrono.running
                ) {
                    const w = wById(S.live.workoutId);
                    if (!w) return;
                    const cs = currentStep(w, liveElapsed() / 60);
                    const box = document.getElementById('stepBox');
                    if (box && box.dataset.idx !== String(cs.idx)) {
                        box.dataset.idx = cs.idx;
                        const tmp = document.createElement('div');
                        tmp.innerHTML = viewLiveRun();
                        const nb = tmp.querySelector('#stepBox');
                        if (nb) box.innerHTML = nb.innerHTML;
                    }
                    const sl = document.querySelector('[data-step-left]');
                    if (sl) sl.textContent = fmtClock(cs.left);
                    const tl = document.getElementById('runTl');
                    if (tl) tl.innerHTML = runTimeline(w, liveElapsed() / 60);
                }
            }

            /* ---------- Récapitulatif ---------- */
            function buildSummary() {
                const L = S.live;
                const dur = Math.round(liveElapsed());
                if (L.type === 'strength') {
                    const exercises = L.exercises
                        .map((e) => ({
                            exId: e.exId,
                            name: e.name,
                            mode: e.mode,
                            factor: e.factor,
                            sets: e.sets.map((s) => ({
                                kg: +s.kg || 0,
                                reps: +s.reps || 0,
                                done: s.done,
                            })),
                            note: e.note,
                        }))
                        .filter((e) => e.sets.some((s) => s.done))
                        .map((e) =>
                            Object.assign(e, {
                                sets: e.sets.filter((s) => s.done),
                            }),
                        );
                    return {
                        id: uid('s'),
                        date: L.date,
                        workoutId: L.workoutId,
                        name: L.name,
                        type: 'strength',
                        durationSec: dur,
                        rpe: null,
                        comment: '',
                        exercises,
                    };
                }
            }
            function prsFor(sess) {
                const out = [];
                (sess.exercises || []).forEach((it) => {
                    const ex = exById(it.exId);
                    if (!ex || ex.bodyweight) return;
                    const before = exerciseHistory(it.exId).filter(
                        (h) => h.session.id !== sess.id,
                    );
                    const bestKg = Math.max(0, ...before.map((h) => h.maxKg));
                    const now = Math.max(0, ...it.sets.map((s) => s.kg));
                    if (before.length && now > bestKg)
                        out.push(
                            ex.name +
                                ' : nouvelle charge max, ' +
                                fmt(now, now % 1 ? 1 : 0) +
                                ' kg (avant ' +
                                fmt(bestKg, bestKg % 1 ? 1 : 0) +
                                ' kg)',
                        );
                    else if (before.length) {
                        const prevVol = before[before.length - 1].vol,
                            v = exVolume(it);
                        if (v > prevVol * 1.05)
                            out.push(
                                ex.name +
                                    ' : volume en hausse de ' +
                                    Math.round((v / prevVol - 1) * 100) +
                                    ' %',
                            );
                    }
                });
                if (sess.type === 'run') {
                    const same = S.sessions.filter(
                        (s) =>
                            s.workoutId === sess.workoutId &&
                            s.id !== sess.id &&
                            s.run,
                    );
                    if (same.length) {
                        const bestD = Math.max(
                            ...same.map((s) => s.run.distance),
                        );
                        const bestA = Math.max(...same.map(runAvg));
                        if (sess.run.distance > bestD)
                            out.push(
                                'Plus longue distance sur cette séance : ' +
                                    fmt(sess.run.distance, 2) +
                                    ' km',
                            );
                        if (runAvg(sess) > bestA + 0.005)
                            out.push(
                                'Meilleure vitesse moyenne : ' +
                                    fmt(runAvg(sess), 2) +
                                    ' km/h (avant ' +
                                    fmt(bestA, 2) +
                                    ')',
                            );
                    }
                }
                return out;
            }

            function viewSummary() {
                const s = UI.summary;
                if (!s) return viewHome();
                const prs = prsFor(s);
                let tiles,
                    detail = '';
                if (s.type === 'strength') {
                    const sets = s.exercises.reduce(
                            (a, e) => a + e.sets.length,
                            0,
                        ),
                        reps = s.exercises.reduce(
                            (a, e) =>
                                a +
                                e.sets.reduce(
                                    (b, x) =>
                                        b + (e.mode === 'time' ? 0 : x.reps),
                                    0,
                                ),
                            0,
                        );
                    tiles = [
                        ['Durée', fmtClock(s.durationSec)],
                        ['Volume', fmtInt(sessionVolume(s)) + ' kg'],
                        ['Séries', sets],
                        ['Répétitions', reps],
                    ];
                    detail = `<div class="card">${
                        s.exercises
                            .map((it) => {
                                const ex = exById(it.exId);
                                const prev =
                                    lastExercisePerf(it.exId, s.date) ||
                                    lastExercisePerf(it.exId);
                                const prevItem =
                                    prev && prev.session.id !== s.id
                                        ? prev.item
                                        : null;
                                const dv = prevItem
                                    ? exVolume(it) - exVolume(prevItem)
                                    : null;
                                return `<div class="ex-row" style="cursor:default;padding:12px 16px;border-bottom:1px solid var(--border);border-radius:0"><span class="thumb">${exImage(ex, { animate: false, pose: 'B' })}</span><span class="grow stack"><span class="nm">${esc(it.name)}</span><span class="sub num">${setsSummary(it)}</span></span>
        ${dv != null && ex && !ex.bodyweight ? `<span class="num ${dv >= 0 ? 'delta-good' : 'delta-bad'}" style="font-size:13px">${dv >= 0 ? '+' : ''}${fmtInt(dv)} kg</span>` : ''}</div>`;
                            })
                            .join('') ||
                        '<p class="empty">Aucune série validée.</p>'
                    }</div>`;
                } else {
                    tiles = [
                        ['Durée', fmtClock(s.durationSec)],
                        ['Distance', fmt(s.run.distance, 2) + ' km'],
                        ['Vitesse moy.', fmt(runAvg(s), 2) + ' km/h'],
                        [
                            'Vitesse max',
                            s.run.max ? fmt(s.run.max, 1) + ' km/h' : '–',
                        ],
                    ];
                    const prev = sessionsSorted().find(
                        (x) =>
                            x.workoutId === s.workoutId &&
                            x.id !== s.id &&
                            x.run,
                    );
                    if (prev)
                        detail = `<div class="card card-pad stack gap-12"><span class="label">Comparé à la dernière fois (${dateShort(prev.date)})</span><div class="grid-3">
      ${[
          ['Distance', s.run.distance - prev.run.distance, ' km', 2],
          ['Vitesse moy.', runAvg(s) - runAvg(prev), ' km/h', 2],
          ['Durée', (s.durationSec - prev.durationSec) / 60, ' min', 1],
      ]
          .map(
              ([k, v, u, dd]) =>
                  `<div class="meta-item"><span class="k">${k}</span><span class="v num ${v >= 0 ? 'delta-good' : 'delta-bad'}">${v >= 0 ? '+' : ''}${fmt(v, dd)}${u}</span></div>`,
          )
          .join('')}</div></div>`;
                }
                const kcal =
                    s.type === 'run' ? kcalRun(s) : kcalStrength(s.durationSec);
                return `
  <div class="card card-pad stack gap-20" style="max-width:720px;margin:0 auto;width:100%">
    <div class="recap-hero"><span class="recap-badge">${ic('check')}</span><h1 class="title-l">Séance terminée</h1><p class="muted">${esc(s.name)} · ${cap(dateLong(s.date))}</p></div>
    <div class="grid-4">${tiles.map(([k, v]) => `<div class="card" style="padding:14px;background:var(--surface-2)"><div class="faint" style="font-size:12px">${k}</div><div class="num" style="font-size:19px;font-weight:600">${v}</div></div>`).join('')}</div>
    ${prs.length ? `<div class="stack gap-8">${prs.map((p) => `<div class="pr">${ic('trophy')}<span>${esc(p)}</span></div>`).join('')}</div>` : ''}
    ${detail}
    ${
        s.type === 'strength'
            ? `<div class="field"><span class="label">Ressenti</span>${ratingHtml(s.rpe, 'sumRpe')}</div>
    <div class="field"><label for="sumComment">Commentaire</label><textarea id="sumComment" class="input" data-in="sum" placeholder="Comment s’est passée la séance ?">${esc(s.comment)}</textarea></div>`
            : ''
    }
    <p class="faint" style="font-size:12.5px">Dépense énergétique estimée : ≈ ${fmtInt(kcal)} kcal. Valeur indicative, non mesurée.</p>
    <div class="row wrapflex" style="justify-content:flex-end">
      ${s.type === 'strength' ? `<button class="btn btn-ghost" data-a="backToLive">Reprendre la séance</button>` : ''}
      <button class="btn btn-primary btn-lg" data-a="saveSummary">${ic('check')}Enregistrer</button></div>
  </div>`;
            }
            /* ============================================================
   HISTORIQUE, DÉTAIL / ÉDITION D'UNE SÉANCE, PROGRESSION
   ============================================================ */
            function historyRow(s) {
                const d = parseIso(s.date);
                let m = '';
                if (s.type === 'run')
                    m = `<span>${fmt(s.run.distance, 2)} km</span><span>${fmtClock(s.durationSec)}</span><span>${fmt(runAvg(s))} km/h</span>`;
                else if (s.type === 'strength')
                    m = `<span>${fmtDur(s.durationSec)}</span><span>${fmtInt(sessionVolume(s))} kg</span><span>${s.exercises.reduce((a, e) => a + e.sets.length, 0)} séries</span>`;
                else
                    m = `<span>${fmtDur(s.durationSec)}</span><span>${esc(s.activity || '')}</span>`;
                return `<button class="h-row" data-a="openSession" data-id="${s.id}">
    <span class="h-date"><b>${d.getDate()}</b><span>${DAY_SHORT[dayIdx(d)]}</span></span>
    <span class="stack" style="min-width:0"><span style="font-weight:500">${esc(s.name)}</span><span class="row gap-8" style="font-size:12.5px"><span style="width:6px;height:6px;border-radius:50%;background:${s.type === 'run' ? 'var(--run)' : s.type === 'strength' ? 'var(--accent)' : 'var(--recovery)'}"></span><span class="faint">${TYPE_LABEL[s.type]}${s.rpe ? ' · ' + rpeLabel(s.rpe) : ''}</span></span></span>
    <span class="h-metrics num">${m}</span></button>`;
            }

            function viewHistory() {
                let list = sessionsSorted();
                if (UI.histType !== 'all')
                    list = list.filter((s) => s.type === UI.histType);
                const groups = [];
                list.forEach((s) => {
                    const d = parseIso(s.date);
                    const key =
                        UI.histGroup === 'week'
                            ? iso(mondayOf(d))
                            : d.getFullYear() + '-' + d.getMonth();
                    let g = groups.find((x) => x.key === key);
                    if (!g) {
                        g = { key, d, items: [] };
                        groups.push(g);
                    }
                    g.items.push(s);
                });
                const gLabel = (g) => {
                    if (UI.histGroup === 'month')
                        return (
                            cap(MONTHS[g.d.getMonth()]) +
                            ' ' +
                            g.d.getFullYear()
                        );
                    const m = mondayOf(g.d);
                    const cur = iso(m) === iso(mondayOf(TODAY));
                    return cur
                        ? 'Cette semaine'
                        : 'Semaine du ' +
                              dateShort(m) +
                              ' au ' +
                              dateShort(addDays(m, 6));
                };
                const gSum = (g) => {
                    const km = g.items.reduce(
                            (a, s) => a + (s.run ? s.run.distance : 0),
                            0,
                        ),
                        sec = g.items.reduce((a, s) => a + s.durationSec, 0);
                    const n = g.items.filter(
                        (s) => s.type !== 'recovery',
                    ).length;

                        `<section class="week-group"><div class="week-group-head"><span style="color:var(--text);font-weight:500">${gLabel(g)}</span><span class="num">${gSum(g)}</span></div><div class="card">${g.items.map(historyRow).join('')}</div></section>`,

            /* ---------- Détail / édition d'une séance réalisée ---------- */

    <div class="field"><label for="ss-dur">Durée</label><div class="input-unit"><input id="ss-dur" class="input num ${err.dur ? 'is-error' : ''}" data-in="ss" data-f="dur" value="${fmtClock(d.durationSec)}"><span>mm:ss</span></div>${err.dur ? `<span class="err">${err.dur}</span>` : ''}</div></div>`;

                    body += `<div class="grid-3">
      <div class="field"><label for="ss-dist">Distance</label><div class="input-unit"><input id="ss-dist" class="input num ${err.dist ? 'is-error' : ''}" inputmode="decimal" data-in="ss" data-f="dist" value="${fmt(d.run.distance, 2)}"><span>km</span></div>${err.dist ? `<span class="err">${err.dist}</span>` : ''}</div>

      <div class="field"><label for="ss-inc">Inclinaison</label><div class="input-unit"><input id="ss-inc" class="input num" inputmode="decimal" data-in="ss" data-f="incline" value="${d.run.incline != null ? d.run.incline : ''}"><span>%</span></div></div></div>
      <div class="row gap-16 wrapflex"><span class="muted">Vitesse moyenne calculée : <b class="num" style="color:var(--text)" id="ssAvg">${fmt(runAvg(d), 2)} km/h</b></span>${d.run.cycles != null ? `<span class="muted">Cycles : <b class="num" style="color:var(--text)">${d.run.cycles}</b></span>` : ''}</div>`;

                            return `<div class="stack gap-8"><div class="row"><span class="thumb" style="width:52px;height:40px">${exImage(ex, { animate: false, pose: 'B' })}</span><span class="grow" style="font-weight:500">${esc(it.name)}</span></div>
      <table class="sets" style="background:var(--bg);border-radius:10px;overflow:hidden"><thead><tr><th>Série</th><th>${ex.bodyweight ? '' : 'kg'}</th><th>${it.mode === 'time' ? 'Secondes' : 'Reps'}</th><th></th></tr></thead><tbody>
      ${it.sets.map((s, j) => `<tr><td><span class="set-num">${j + 1}</span></td><td>${ex.bodyweight ? '<span class="faint">PDC</span>' : `<input class="cell-in" inputmode="decimal" data-in="ssSet" data-e="${i}" data-s="${j}" data-f="kg" value="${fmt(s.kg, s.kg % 1 ? 1 : 0)}" aria-label="Charge">`}</td><td><input class="cell-in" inputmode="numeric" data-in="ssSet" data-e="${i}" data-s="${j}" data-f="reps" value="${s.reps}" aria-label="Répétitions"></td><td></td></tr>`).join('')}</tbody></table>
      ${it.note ? `<span class="faint" style="font-size:12.5px">Note : ${esc(it.note)}</span>` : ''}</div>`;
                        })
                        .join('');

                if (d.type === 'recovery') {
                    body += `<div class="field"><label for="ss-act">Activité</label><input id="ss-act" class="input" data-in="ss" data-f="activity" value="${esc(d.activity || '')}"></div>`;
                }
                body += `<div class="field"><span class="label">Ressenti</span>${ratingHtml(d.rpe, 'ssRpe')}</div>
    <div class="field"><label for="ss-com">Commentaire</label><textarea id="ss-com" class="input" data-in="ss" data-f="comment">${esc(d.comment || '')}</textarea></div>
    ${d.type === 'run' ? `<p class="faint" style="font-size:12.5px">Dépense estimée : ≈ ${fmtInt(kcalRun(d))} kcal (indicatif).</p>` : ''}
    <p class="faint" style="font-size:12px">Cette séance conserve les valeurs du programme au moment où elle a été réalisée. Modifier le programme ne la change pas.</p>`;
                openSheet(
                    `<div class="sheet-head"><div class="grow stack"><span class="faint" style="font-size:12px">${cap(dateLong(d.date))}</span><h3 class="title-m">${esc(d.name)}</h3></div>${typeChip(d.type)}<button class="btn btn-ghost btn-icon" data-a="closeSheet" aria-label="Fermer">${ic('x')}</button></div>

            /* ---------- Progression ---------- */
            function viewStats() {

            function weeksBack(n) {

  ${filt}

      runs.length
          ? `<div class="charts-grid">

    ${chartCard('Distance par séance', fmt(pts[pts.length - 1].value, 2) + ' km', runs.length + ' courses · ' + fmt(total) + ' km au total', { kind: 'line', data: pts, unit: 'km', d: 2 })}

          [
              'Plus longue distance',

              2,

          .map(

                  `<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span class="muted">${k}</span><span class="num" style="font-weight:500">${fmt(v, dd)} ${u}</span></div>`,
          )
          .join('')}
      <p class="faint" style="font-size:12px">Les vitesses comparées entre séances différentes (fondamentale, fractionné) n’ont pas le même sens : filtre par séance pour suivre une progression fiable.</p></div>

            function statsStrength() {
                const used = [
                    ...new Set(
                        S.sessions
                            .filter((s) => s.exercises)

                const ex = exById(UI.statsEx);
                const h = exerciseHistory(UI.statsEx);
                const weeks = weeksBack(8).map((m) => ({

                    .map((id) => {

                        return `<option value="${id}" ${id === UI.statsEx ? 'selected' : ''}>${esc(e ? e.name : id)}</option>`;

                    .join('');
                const isTime = ex && ex.mode === 'time';
                const bw = ex && ex.bodyweight;
                const lastH = h[h.length - 1],
                    firstH = h[0];
                const best = h.reduce((b, x) => {
                    x.item.sets.forEach((s) => {

                          label: dateShort(x.date),

                      }));

                    label: dateShort(x.date),

      <div class="meta-item"><span class="k">Progression</span><span class="v num delta-good">${bw ? '+' + (lastH.reps - firstH.reps || 0) + (isTime ? ' s' : ' reps') : '+' + fmt(lastH.maxKg - firstH.maxKg, (lastH.maxKg - firstH.maxKg) % 1 ? 1 : 0) + ' kg'}</span></div>
