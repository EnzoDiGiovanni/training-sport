    ${chartCard(isTime ? 'Temps total de maintien' : 'Répétitions totales', reps[reps.length - 1].value + (isTime ? ' s' : ''), 'par séance', { kind: 'bar', data: reps, unit: isTime ? 's' : 'reps', d: 0 })}
    ${!bw ? chartCard('Volume par séance', fmtInt(lastH.vol) + ' kg', 'charge × reps × haltères', { kind: 'line', data: vol, unit: 'kg', d: 0 }) : ''}
    ${chartCard('Séances de musculation', weeks[weeks.length - 2].value + ' / sem.', 'semaine dernière', { kind: 'bar', data: weeks, unit: 'séances', d: 0, goal: S.schedule.filter((id) => (wById(id) || {}).type === 'strength').length })}
  </div>
  <section class="section"><div class="section-head"><h2>Historique de l’exercice</h2></div>
  <div class="card">${h
      .slice()
      .reverse()
      .slice(0, 8)
      .map(
          (x) =>
              `<button class="h-row" data-a="openSession" data-id="${x.session.id}" style="grid-template-columns:90px 1fr auto"><span class="muted num" style="font-size:13px">${dateShort(x.date)}</span><span class="num">${setsSummary(x.item)}</span><span class="faint num" style="font-size:13px">${bw ? '' : fmtInt(x.vol) + ' kg'}</span></button>`,
      )
      .join('')}</div></section>`;
            }

            function movingAvg(list, days) {
                return list.map((p) => {
                    const d = parseIso(p.date);
                    const from = iso(addDays(d, -days + 1));
                    const w = list.filter(
                        (x) => x.date >= from && x.date <= p.date,
                    );
                    return w.reduce((a, x) => a + x.kg, 0) / w.length;
                });
            }

            function statsWeight() {
                const list = S.weights
                    .slice()
                    .sort((a, b) => (a.date < b.date ? -1 : 1));
                const ma = movingAvg(list, 7);
                const last = list[list.length - 1],
                    first = list[0];
                const r30 =
                    list.find((x) => x.date >= iso(addDays(TODAY, -30))) ||
                    first;
                const p = S.profile;
                const left = last.kg - p.targetWeight;
                const data = list.map((x, i) => ({
                    label: dateShort(x.date),
                    value: x.kg,
                    ma: ma[i],
                }));
                const weeksSpan = Math.max(
                    1,
                    (parseIso(last.date) - parseIso(first.date)) / (7 * 864e5),
                );
                const rate = (ma[ma.length - 1] - ma[0]) / weeksSpan;
                return `
  <div class="grid-4">
    ${[
        ['Poids actuel', fmt(last.kg) + ' kg', cap(dateLong(last.date))],
        [
            'Sur 30 jours',
            (last.kg - r30.kg > 0 ? '+' : '') + fmt(last.kg - r30.kg) + ' kg',
            'moyenne mobile : ' +
                (ma[ma.length - 1] - movingAvg(list, 7)[list.indexOf(r30)] > 0
                    ? '+'
                    : '') +
                fmt(ma[ma.length - 1] - movingAvg(list, 7)[list.indexOf(r30)]) +
                ' kg',
        ],
        [
            'Rythme moyen',
            fmt(rate, 2) + ' kg / sem.',
            rate < 0 && rate > -0.75
                ? 'rythme progressif, compatible recompo'

                  ? 'rapide : risque de perte musculaire'
                  : 'stable ou en hausse',
        ],
        [
            'Objectif',
            fmt(p.targetWeight, 1) + ' kg',
            left > 0 ? 'encore ' + fmt(left) + ' kg' : 'objectif atteint',

    ]
        .map(
            ([k, v, d], i) =>
                `<div class="card stat"><span class="k">${k}</span><span class="v num ${i === 1 && last.kg - r30.kg <= 0 ? 'delta-good' : ''}" style="font-size:22px">${v}</span><span class="d">${d}</span></div>`,
        )
        .join('')}
  </div>
  <div class="card card-pad"><div class="chart-head"><div class="stack"><span class="label">Historique du poids</span><span class="faint" style="font-size:12.5px"><span style="display:inline-block;width:10px;height:2px;background:var(--accent);vertical-align:middle;margin-right:6px"></span>moyenne mobile 7 jours <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);vertical-align:middle;margin:0 6px 0 14px"></span>pesées</span></div></div>
    ${chartSlot({ kind: 'weight', data, unit: 'kg', d: 1, h: 240, goal: p.targetWeight })}
    <p class="faint" style="font-size:12px;margin-top:10px">Le poids varie naturellement de 0,5 à 1 kg d’un jour à l’autre (eau, sel, digestion). Fie-toi à la moyenne mobile. En recomposition, le poids peut stagner alors que la masse grasse baisse : le tour de taille serait un bon indicateur complémentaire.</p></div>
  <div class="grid-2" style="align-items:start">
    <div class="card card-pad stack gap-12"><h2 class="title-m">Nouvelle pesée</h2>
      <div class="grid-2"><div class="field"><label for="wDate">Date</label><input id="wDate" type="date" class="input" value="${iso(TODAY)}" max="${iso(TODAY)}"></div>
      <div class="field"><label for="wKg">Poids</label><div class="input-unit"><input id="wKg" class="input num" inputmode="decimal" placeholder="${fmt(last.kg)}"><span>kg</span></div><span class="err" id="wErr"></span></div></div>
      <button class="btn btn-primary" data-a="addWeight">${ic('plus')}Enregistrer la pesée</button>

    <div class="card"><div style="padding:14px 18px 6px" class="label">Dernières pesées</div>${list
        .slice()
        .reverse()
        .slice(0, 6)
        .map(
            (x) =>
                `<div class="row" style="padding:10px 18px;border-top:1px solid var(--border)"><span class="grow muted">${cap(dateLong(x.date))}</span><span class="num">${fmt(x.kg)} kg</span><button class="btn btn-ghost btn-icon" data-a="delWeight" data-date="${x.date}" aria-label="Supprimer la pesée du ${dateShort(x.date)}">${ic('trash')}</button></div>`,
        )
        .join('')}</div>
  </div>`;
            }

            /* ---------- Moteur de graphiques SVG ---------- */
            function niceTicks(min, max, n = 4) {
                if (min === max) {
                    min -= 1;
                    max += 1;
                }
                const span = max - min;
                const step0 = span / (n - 1);
                const mag = Math.pow(10, Math.floor(Math.log10(step0)));
                const step =
                    [1, 2, 2.5, 5, 10]
                        .map((m) => m * mag)
                        .find((s) => s >= step0) || 10 * mag;
                const lo = Math.floor(min / step) * step,
                    hi = Math.ceil(max / step) * step;
                const out = [];
                for (let v = lo; v <= hi + step / 1e6; v += step)
                    out.push(+v.toFixed(6));
                return out;
            }
            function drawCharts() {
                PENDING_CHARTS.forEach(drawChart);
            }
            function drawChart(cfg) {
                const el = document.getElementById(cfg.id);
                if (!el) return;
                const W = Math.max(240, el.clientWidth),
                    H = cfg.h || 200;
                const pad = { l: 40, r: 14, t: 14, b: 26 };
                const data = cfg.data;
                if (!data.length) {
                    el.innerHTML =
                        '<p class="empty">Pas encore de données.</p>';
                    return;
                }
                const vals = data
                    .map((d) => d.value)
                    .concat(cfg.kind === 'weight' ? data.map((d) => d.ma) : [])
                    .concat(
                        cfg.goal != null && cfg.kind !== 'line'
                            ? [cfg.goal]
                            : [],
                    );
                let mn = Math.min(...vals),
                    mx = Math.max(...vals);
                if (cfg.kind === 'bar') {
                    mn = 0;
                } else {
                    const sp = mx - mn || 1;
                    mn -= sp * 0.15;
                    mx += sp * 0.15;
                    if (cfg.kind === 'weight' && cfg.goal != null) {
                        mn = Math.min(mn, cfg.goal - 0.3);
                    }
                }
                const ticks = niceTicks(mn, mx, 4);
                mn = ticks[0];
                mx = ticks[ticks.length - 1];
                const iw = W - pad.l - pad.r,
                    ih = H - pad.t - pad.b;
                const y = (v) => pad.t + ih - ((v - mn) / (mx - mn)) * ih;
                const n = data.length;
                const bw =
                    cfg.kind === 'bar' ? Math.min(34, (iw / n) * 0.62) : 0;
                const x = (i) =>
                    cfg.kind === 'bar'
                        ? pad.l + ((i + 0.5) * iw) / n
                        : pad.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
                const tfmt = (v) => fmt(v, cfg.d > 0 && mx - mn < 5 ? 1 : 0);
                let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique">`;
                ticks.forEach((t) => {
                    s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="#222227" stroke-width="1"/><text x="${pad.l - 8}" y="${y(t) + 3.5}" text-anchor="end">${tfmt(t)}</text>`;
                });
                // labels X : premier, milieu, dernier
                const idxs =
                    n <= 8
                        ? data.map((_, i) => i)
                        : [0, Math.floor((n - 1) / 2), n - 1];
                idxs.forEach((i) => {
                    s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${cfg.kind === 'bar' || n <= 8 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${data[i].label}</text>`;
                });
                if (cfg.goal != null && cfg.goal >= mn && cfg.goal <= mx) {
                    s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(cfg.goal)}" y2="${y(cfg.goal)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/><text x="${W - pad.r}" y="${y(cfg.goal) - 6}" text-anchor="end" style="fill:var(--muted)">objectif ${fmt(cfg.goal, cfg.goal % 1 ? 1 : 0)}</text>`;
                }
                if (cfg.kind === 'bar') {
                    data.forEach((d, i) => {
                        const h0 = Math.max(0, y(mn) - y(d.value));
                        const isLast = d.cur || i === n - 1;
                        s += `<rect x="${x(i) - bw / 2}" y="${y(d.value)}" width="${bw}" height="${h0}" rx="4" fill="var(--accent)" opacity="${isLast ? 1 : 0.42}"/>`;
                        if (n <= 10 && d.value > 0)
                            s += `<text x="${x(i)}" y="${y(d.value) - 6}" text-anchor="middle" style="fill:${isLast ? 'var(--text)' : 'var(--faint)'}">${fmt(d.value, cfg.d && d.value % 1 ? cfg.d : 0)}</text>`;
                    });
                } else {
                    const series =
                        cfg.kind === 'weight'
                            ? data.map((d) => d.ma)
                            : data.map((d) => d.value);
                    let path = '';
                    if (cfg.step)
                        series.forEach((v, i) => {
                            path += i
                                ? `H${x(i).toFixed(1)}V${y(v).toFixed(1)}`
                                : `M${x(i).toFixed(1)} ${y(v).toFixed(1)}`;
                        });
                    else
                        path = series
                            .map(
                                (v, i) =>
                                    (i ? 'L' : 'M') +
                                    x(i).toFixed(1) +
                                    ' ' +
                                    y(v).toFixed(1),
                            )
                            .join(' ');
                    const gid = uid('g');
                    s += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".16"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
                    s += `<path d="${path} L${x(n - 1).toFixed(1)} ${y(mn)} L${x(0).toFixed(1)} ${y(mn)} Z" fill="url(#${gid})"/>`;
                    if (cfg.kind === 'weight')
                        data.forEach((d, i) => {
                            s += `<circle cx="${x(i)}" cy="${y(d.value)}" r="2.6" fill="var(--muted)" opacity=".7"/>`;
                        });
                    s += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
                    if (cfg.kind !== 'weight' && n <= 24)
                        series.forEach((v, i) => {
                            if (i < n - 1)
                                s += `<circle cx="${x(i)}" cy="${y(v)}" r="2.4" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.5"/>`;
                        });
                    const lv = series[n - 1];
                    s += `<circle cx="${x(n - 1)}" cy="${y(lv)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
                }
                s += `<line class="guide" x1="0" x2="0" y1="${pad.t}" y2="${pad.t + ih}" stroke="var(--border-strong)" opacity="0"/><circle class="hl" r="4" fill="var(--text)" opacity="0"/>`;
                s += `<rect x="${pad.l}" y="0" width="${iw}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
                el.innerHTML = s;
                const svg = el.querySelector('svg'),
                    tip = el.querySelector('.tip'),
                    guide = el.querySelector('.guide'),
                    hl = el.querySelector('.hl');
                const unit = cfg.unit;
                const show = (ev) => {
                    const r = svg.getBoundingClientRect();
                    const px = ev.clientX - r.left;
                    let i =
                        cfg.kind === 'bar'
                            ? Math.floor((px - pad.l) / (iw / n))
                            : Math.round(
                                  (px - pad.l) / (iw / Math.max(1, n - 1)),
                              );
                    i = Math.max(0, Math.min(n - 1, i));
                    const d = data[i];
                    const v = cfg.kind === 'weight' ? d.value : d.value;
                    guide.setAttribute('x1', x(i));
                    guide.setAttribute('x2', x(i));
                    guide.setAttribute('opacity', 1);
                    if (cfg.kind !== 'bar') {
                        hl.setAttribute('cx', x(i));
                        hl.setAttribute(
                            'cy',
                            y(cfg.kind === 'weight' ? d.value : v),
                        );
                        hl.setAttribute('opacity', 1);
                    }
                    tip.innerHTML = `<span class="faint">${d.label}</span> · <b>${fmt(v, cfg.d)} ${unit}</b>${cfg.kind === 'weight' ? ` <span class="faint">· moy. ${fmt(d.ma, 1)}</span>` : ''}`;
                    tip.style.left =
                        Math.max(60, Math.min(W - 60, x(i))) + 'px';
                    tip.style.top = (cfg.kind === 'bar' ? y(v) : y(v)) + 'px';
                    tip.style.opacity = 1;
                };
                const hide = () => {
                    tip.style.opacity = 0;
                    guide.setAttribute('opacity', 0);
                    hl.setAttribute('opacity', 0);
                };
                svg.addEventListener('pointermove', show);
                svg.addEventListener('pointerdown', show);
                svg.addEventListener('pointerleave', hide);
            }
            /* ============================================================
   PROGRAMME, ÉDITEUR, BIBLIOTHÈQUE, PARAMÈTRES, ÉVÉNEMENTS
   ============================================================ */
            function programWarnings() {
                const out = [];
                const p = S.profile;
                S.workouts.forEach((w) => {
                    if (w.type === 'strength')
                        w.exercises.forEach((we) => {
                            const ex = exById(we.exId);
                            const mx = maxLoadFor(ex);
                            if (ex && !ex.bodyweight && we.kg > mx)
                                out.push(
                                    `${w.name} · ${ex.name} : ${we.kg} kg prévus, au-delà de ton matériel (${mx} kg max${ex.factor === 2 ? ' par haltère' : ''}).`,
                                );
                        });
                    if (w.type === 'run')
                        flatSteps(w).forEach((s) => {
                            if (s.vMax > p.treadmillMax)
                                out.push(
                                    `${w.name} · ${s.label} : ${s.vMax} km/h prévus, ton tapis est limité à ${p.treadmillMax} km/h.`,
                                );
                        });
                });
                return [...new Set(out)];
            }

            function viewProgram() {
                const tab = UI.progTab;
                const seg = `<div class="seg" role="group" aria-label="Section"><button data-a="progTab" data-v="plan" aria-pressed="${tab === 'plan'}">Programme</button><button data-a="progTab" data-v="library" aria-pressed="${tab === 'library'}">Bibliothèque d’exercices</button></div>`;
                const head = `<div class="page-head"><div class="stack gap-4"><span class="eyebrow">Configuration</span><h1 class="title-xl">${tab === 'plan' ? 'Mon programme' : 'Bibliothèque'}</h1></div>${seg}</div>`;
                if (tab === 'library') return head + viewLibrary();
                const opts = (id) =>
                    `<option value="">Repos</option>` +
                    S.workouts
                        .filter((w) => w.type !== 'rest')
                        .map(
                            (w) =>
                                `<option value="${w.id}" ${w.id === id ? 'selected' : ''}>${esc(w.name)}</option>`,
                        )
                        .join('');
                const plan = DAY_NAMES.map((n, i) => {
                    const w = wById(S.schedule[i]);
                    const t = w ? w.type : 'rest';
                    return `<div class="card plan-day"><span class="dn">${n}</span><span class="grow" style="display:flex;flex-direction:column;gap:8px">${typeChip(t === 'rest' ? 'rest' : t)}<select class="input" aria-label="Séance du ${n.toLowerCase()}" data-in="schedule" data-d="${i}">${opts(w && w.type !== 'rest' ? w.id : '')}</select></span></div>`;
                }).join('');
                const warns = programWarnings();
                const cards = S.workouts
                    .filter((w) => w.type !== 'rest')
                    .map((w) => {
                        const days = S.schedule
                            .map((id, i) => (id === w.id ? DAY_SHORT[i] : null))
                            .filter(Boolean);
                        let preview = '';
                        if (w.type === 'strength')
                            preview = `<div class="thumbs">${w.exercises
                                .slice(0, 6)
                                .map(
                                    (we) =>
                                        `<span class="thumb">${exImage(exById(we.exId), { animate: false, pose: 'B' })}</span>`,
                                )
                                .join(
                                    '',
                                )}</div><span class="faint" style="font-size:12.5px">${w.exercises.map((we) => esc(exById(we.exId).name)).join(' · ')}</span>`;
                        if (w.type === 'run') preview = runTimeline(w);
                        if (w.type === 'recovery')
                            preview = `<span class="faint" style="font-size:13px">${esc(w.objective)}</span>`;
                        return `<div class="card w-card">
      <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="stack gap-4"><div class="row gap-8">${typeChip(w.type)}<span class="faint num" style="font-size:12.5px">${durationLabel(w)}</span></div><h3 style="font-size:17px">${esc(w.name)}</h3></div>
      <span class="faint" style="font-size:12.5px">${days.length ? days.join(', ') : 'Non planifiée'}</span></div>
      ${preview}
      <div class="row gap-8" style="margin-top:auto"><button class="btn btn-sm" data-a="editWorkout" data-wid="${w.id}">${ic('edit')}Modifier</button><button class="btn btn-sm btn-ghost" data-a="dupWorkout" data-wid="${w.id}">${ic('copy')}Dupliquer</button><button class="btn btn-sm btn-ghost" data-a="delWorkout" data-wid="${w.id}" style="margin-left:auto" aria-label="Supprimer ${esc(w.name)}">${ic('trash')}</button></div></div>`;
                    })
                    .join('');
                return (
                    head +
                    `
  <div class="notice">${ic('info')}<span>Les modifications s’appliquent aux prochaines séances et au tableau de bord. Les ${S.sessions.length} séances déjà enregistrées gardent leurs valeurs d’origine.</span></div>
  ${warns.length ? `<div class="notice warn">${ic('warn')}<span>${warns.map(esc).join('<br>')}</span></div>` : ''}
  <section class="section"><div class="section-head"><h2>Semaine type</h2><span class="faint num" style="font-size:13px">${plannedPerWeek()} séances / semaine</span></div><div class="plan-grid">${plan}</div></section>
  <section class="section"><div class="section-head"><h2>Séances</h2><button class="btn btn-sm btn-primary" data-a="newWorkout">${ic('plus')}Nouvelle séance</button></div><div class="w-grid">${cards}</div></section>`
                );
            }

            function viewLibrary() {
                const q = UI.libQuery.toLowerCase().trim();
                const muscles = [
                    'all',
                    'Pectoraux',
                    'Dos',
                    'Jambes',
                    'Épaules',
                    'Bras',
                    'Abdominaux',
                ];
                const match = (e, m) => {
                    if (m === 'all') return true;
                    const t = (e.muscle + ' ' + e.secondary).toLowerCase();
                    return {
                        Pectoraux: /pector/,
                        Dos: /dos|dorsal/,
                        Jambes: /quadri|ischio|fess/,
                        Épaules: /épaule|deltoï/,
                        Bras: /biceps|triceps/,
                        Abdominaux: /abdo|oblique|gainage/,
                    }[m].test(t);
                };
                const list = S.exercises.filter(
                    (e) =>
                        (!q ||
                            (e.name + ' ' + e.muscle)
                                .toLowerCase()
                                .includes(q)) &&
                        match(e, UI.libMuscle),
                );
                return `
  <div class="row wrapflex" style="justify-content:space-between">
    <div class="input-unit" style="min-width:240px;flex:1;max-width:360px"><input class="input" placeholder="Rechercher un exercice" aria-label="Rechercher un exercice" data-in="libQuery" value="${esc(UI.libQuery)}" id="libQ"><span>${ic('search').replace('class=""', 'style="width:16px;height:16px"')}</span></div>
    <button class="btn btn-primary" data-a="newExercise">${ic('plus')}Exercice personnalisé</button></div>
  <div class="filters">${muscles.map((m) => `<button class="fchip" data-a="libMuscle" data-v="${m}" aria-pressed="${UI.libMuscle === m}">${m === 'all' ? 'Tous' : m}</button>`).join('')}</div>
  <div class="lib-grid">${list.map((e) => `<button class="card lib-card" data-a="exInfo" data-ex="${e.id}"><div class="illo">${exImage(e)}</div><div class="body"><span style="font-weight:600">${esc(e.name)}</span><span class="faint" style="font-size:12.5px">${esc(e.muscle)}</span><span class="faint" style="font-size:12px">${esc(e.equipment)}</span>${e.custom ? '<span class="chip" style="align-self:flex-start;margin-top:4px">Personnalisé</span>' : ''}</div></button>`).join('') || '<div class="card empty">Aucun exercice trouvé.</div>'}</div>`;
            }

            /* ---------- Fiche exercice ---------- */
            function exerciseSheet(exId) {

                    ? `<div class="stack gap-8"><span class="label">Tes performances</span>${chartSlot({ kind: 'line', data: h.map((x) => ({ label: dateShort(x.date), value: e.bodyweight ? Math.max(...x.item.sets.map((s) => s.reps)) : x.maxKg })), unit: e.bodyweight ? (e.mode === 'time' ? 's' : 'reps') : 'kg', d: 1, h: 150, step: !e.bodyweight })}
    <div class="card" style="background:var(--bg)">${h
        .slice(-3)
        .reverse()
        .map(
            (x) =>
                `<div class="row" style="padding:9px 14px;border-bottom:1px solid var(--border)"><span class="muted num" style="width:70px;font-size:13px">${dateShort(x.date)}</span><span class="num grow" style="font-size:13.5px">${setsSummary(x.item)}</span></div>`,
        )
        .join('')}</div></div>`
                    : '';
                PENDING_CHARTS = [];

    <div class="sheet-body">
      <div class="illo">${exImage(e)}</div>
      ${e.image ? '' : `<div class="frames"><figure><div class="illo">${illoSvg(e.illo, { pose: 'A' })}</div><figcaption>Position de départ</figcaption></figure><figure><div class="illo">${illoSvg(e.illo, { pose: 'B' })}</div><figcaption>Position finale</figcaption></figure></div>`}
      <div class="row wrapflex gap-8"><span class="chip chip-strength">${esc(e.muscle)}</span>${e.secondary ? `<span class="chip">${esc(e.secondary)}</span>` : ''}<span class="chip">${esc(e.equipment)}</span></div>
      ${e.desc ? `<p class="muted">${esc(e.desc)}</p>` : ''}
      ${e.cues && e.cues.length ? `<div class="stack gap-8"><span class="label">Consignes d’exécution</span><ul class="cues">${e.cues.map((c) => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
      ${e.mistakes && e.mistakes.length ? `<div class="stack gap-8"><span class="label">Erreurs fréquentes</span><ul class="cues bad">${e.mistakes.map((c) => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
      ${perf}

                                  .slice()
                                  .reverse()

                    .map((id, i) => (id === wid ? i : null))

          <div style="min-width:0"><div style="font-weight:500">${esc(ex.name)}</div><div class="faint" style="font-size:12.5px">${esc(ex.muscle)} · ${esc(ex.equipment)}</div>
            <div class="params">${fld('sets', 'Séries', '', we.sets)}${fld('rMin', ex.mode === 'time' ? 'Durée min' : 'Reps min', ex.mode === 'time' ? 's' : '', we.rMin)}${fld('rMax', ex.mode === 'time' ? 'Durée max' : 'Reps max', ex.mode === 'time' ? 's' : '', we.rMax)}${ex.bodyweight ? '' : fld('kg', ex.factor === 2 ? 'Charge / haltère' : 'Charge', 'kg', we.kg)}${fld('rest', 'Repos', 's', we.rest)}</div>
            ${over ? `<div class="err" style="margin-top:6px">Au-delà de ton matériel : ${mx} kg max${ex.factor === 2 ? ' par haltère' : ''}.</div>` : ''}${+we.rMin > +we.rMax ? `<div class="err" style="margin-top:6px">Le minimum dépasse le maximum.</div>` : ''}</div>
          <button class="btn btn-ghost btn-icon rm" data-a="rmEx" data-i="${i}" aria-label="Retirer ${esc(ex.name)}">${ic('trash')}</button></div>`;
              })
              .join('') ||
          '<p class="empty">Aucun exercice. Ajoute-en un depuis la bibliothèque.</p>'
      }</div>
      ${err.exercises ? `<span class="err">${err.exercises}</span>` : ''}
      <div><button class="btn" data-a="pickExercise">${ic('plus')}Ajouter un exercice</button></div></section>`;
                }
                if (d.type === 'run') {
                    const stepRow = (
                        s,
                        path,
                        canUp,
                        canDown,
                    ) => `<div class="edit-ex" style="grid-template-columns:auto 1fr auto">

            /* ---------- Paramètres ---------- */
            function viewSettings() {
                const p =
                    UI.settingsDraft || (UI.settingsDraft = clone(S.profile));
                const err = UI.settingsErr || {};
                const f = (k, l, u, opts = {}) =>
                    `<div class="field"><label for="p-${k}">${l}</label><div class="${u ? 'input-unit' : ''}"><input id="p-${k}" class="input ${u ? 'num' : ''} ${err[k] ? 'is-error' : ''}" ${u ? 'inputmode="decimal"' : ''} data-in="prof" data-f="${k}" value="${esc(p[k])}">${u ? `<span>${u}</span>` : ''}</div>${err[k] ? `<span class="err">${err[k]}</span>` : opts.hint ? `<span class="hint">${opts.hint}</span>` : ''}</div>`;
                const tog = (k, l) =>
                    `<label class="row" style="justify-content:space-between;padding:6px 0;cursor:pointer"><span>${l}</span><input type="checkbox" data-in="profChk" data-f="${k}" ${p[k] ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--accent)"></label>`;
                const bmi = p.weight / Math.pow(p.height / 100, 2);
                const sec = (t, body, sub = '') =>
                    `<section class="card card-pad stack gap-16"><div class="stack gap-4"><h2 class="title-m">${t}</h2>${sub ? `<p class="faint" style="font-size:13px">${sub}</p>` : ''}</div>${body}</section>`;
                return `
  <div class="page-head"><div class="stack gap-4"><span class="eyebrow">Profil</span><h1 class="title-xl">Paramètres</h1></div><button class="btn btn-primary" data-a="saveSettings">${ic('check')}Enregistrer</button></div>
  ${sec(
      'Profil',
      `<div class="grid-3">${f('name', 'Prénom', '')}${f('height', 'Taille', 'cm')}${f('weight', 'Poids actuel', 'kg', { hint: 'Une modification crée une pesée datée d’aujourd’hui.' })}</div>
    <p class="faint" style="font-size:12.5px">IMC indicatif : ${fmt(bmi)}. Peu pertinent en recomposition : il ne distingue pas masse grasse et masse musculaire.</p>`,
  )}
  ${sec(
      'Objectifs',
      `<div class="grid-3">${f('targetWeight', 'Poids cible', 'kg')}${f('goalSessions', 'Séances par semaine', '')}${f('goalKm', 'Kilomètres par semaine', 'km')}</div>
    <div class="field"><label for="p-goals">Objectifs personnels (un par ligne)</label><textarea id="p-goals" class="input" data-in="prof" data-f="goalsText">${esc(p.goalsText != null ? p.goalsText : p.goals.join('\n'))}</textarea></div>`,
  )}
  ${sec('Activité quotidienne', `<div class="grid-2">${f('stepsMin', 'Pas par jour, minimum', 'pas')}${f('stepsMax', 'Pas par jour, maximum', 'pas')}</div>`)}
  ${sec('Course et tapis', `<div class="grid-3">${f('runLevel', 'Allure actuelle', 'km/h')}${f('treadmillMax', 'Vitesse max du tapis', 'km/h')}${f('treadmillInclineMax', 'Inclinaison max', '%')}</div>`, 'Les vitesses du programme et les saisies sont contrôlées par rapport à ces limites.')}
  ${sec(
      'Matériel de musculation',
      `<div class="grid-3">${f('dbMax', 'Charge max par haltère', 'kg')}${f('dbCount', 'Nombre d’haltères', '')}${f('dbStep', 'Pas de réglage', 'kg', { hint: 'Plus petit écart de charge possible' })}</div>
    <div class="stack">${tog('dbCombine', 'Charges combinables en un seul haltère')}${tog('bench', 'Banc de musculation')}${tog('benchIncline', 'Banc inclinable')}</div>
    <div class="notice">${ic('info')}<span>Charge max utilisable : ${p.dbMax} kg par haltère, ${p.dbCombine ? p.dbMax * 2 + ' kg sur un seul haltère combiné' : 'pas de combinaison'}.</span></div>`,
  )}
  ${sec('Entraînement', `<div class="grid-3">${f('restDefault', 'Repos par défaut', 's', { hint: 'Appliqué aux nouveaux exercices' })}</div>`)}
  ${sec('Données du prototype', `<div class="row wrapflex">${UI.confirmReset ? `<span class="muted grow">Toutes tes modifications seront perdues.</span><button class="btn" data-a="resetCancel">Annuler</button><button class="btn btn-danger" data-a="resetConfirm">Réinitialiser</button>` : `<button class="btn btn-danger" data-a="reset">${ic('reset')}Réinitialiser les données de démonstration</button>`}</div>`, 'Dans le prototype, les données restent dans ce navigateur uniquement.')}
  <div class="row" style="justify-content:flex-end"><button class="btn btn-primary btn-lg" data-a="saveSettings">${ic('check')}Enregistrer les paramètres</button></div>`;
            }
            const PROF_RULES = {
                height: [100, 230, 'Entre 100 et 230 cm.'],
                weight: [30, 250, 'Entre 30 et 250 kg.'],
                targetWeight: [30, 250, 'Entre 30 et 250 kg.'],
                goalSessions: [0, 14, 'Entre 0 et 14.'],
                goalKm: [0, 300, 'Entre 0 et 300 km.'],
                stepsMin: [0, 60000, 'Valeur invalide.'],
                stepsMax: [0, 60000, 'Valeur invalide.'],
                runLevel: [2, 25, 'Entre 2 et 25 km/h.'],
                treadmillMax: [4, 30, 'Entre 4 et 30 km/h.'],
                treadmillInclineMax: [0, 40, 'Entre 0 et 40 %.'],
                dbMax: [1, 100, 'Entre 1 et 100 kg.'],
                dbCount: [0, 10, 'Entre 0 et 10.'],
                dbStep: [0.25, 10, 'Entre 0,25 et 10 kg.'],
                restDefault: [0, 600, 'Entre 0 et 600 s.'],
            };

            /* ---------- Sheet ---------- */
            function openSheet(html, wide) {
                document.getElementById('sheet').innerHTML =
                    `<div class="scrim" data-a="scrim"><div class="sheet ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
                document.body.style.overflow = 'hidden';
            }
            function closeSheet() {
                document.getElementById('sheet').innerHTML = '';
                document.body.style.overflow = '';
                UI.sheet = null;
            }
            function sheetScroll() {
                const s = document.querySelector('.sheet');
                return s ? s.scrollTop : 0;
            }
            function restoreSheetScroll(v) {
                const s = document.querySelector('.sheet');
                if (s) s.scrollTop = v;
            }

            function recoverySheet() {
                UI.sheet = {
                    kind: 'recovery',
                    act: 'Marche',
                    min: '30',
                    rpe: 1,
                    comment: '',
                };
                const r = UI.sheet;
                openSheet(`<div class="sheet-head"><h3 class="grow title-m">Activité de récupération</h3><button class="btn btn-ghost btn-icon" data-a="closeSheet" aria-label="Fermer">${ic('x')}</button></div>
    <div class="sheet-body"><p class="muted">Facultatif. Une activité douce aide à récupérer sans fatiguer.</p>
      <div class="field"><span class="label">Activité</span><div class="filters">${['Marche', 'Mobilité', 'Étirements', 'Vélo tranquille'].map((a) => `<button class="fchip" data-a="recAct" data-v="${a}" aria-pressed="${r.act === a}">${a}</button>`).join('')}</div></div>
      <div class="field" style="max-width:200px"><label for="rec-min">Durée</label><div class="input-unit"><input id="rec-min" class="input num" inputmode="numeric" value="${r.min}" data-in="rec" data-f="min"><span>min</span></div></div>
      <div class="field"><label for="rec-com">Commentaire</label><textarea id="rec-com" class="input" data-in="rec" data-f="comment"></textarea></div></div>
    <div class="sheet-foot"><button class="btn" data-a="closeSheet">Annuler</button><button class="btn btn-primary" data-a="saveRecovery">Enregistrer</button></div>`);
            }

            /* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
            const A = {
                nav(el) {
                    if (el.dataset.tab) UI.statsTab = el.dataset.tab;
                    if (el.dataset.to === 'home') UI.selDay = dayIdx(TODAY);
                    if (el.dataset.to === 'settings') {
                        UI.settingsDraft = null;
                        UI.settingsErr = {};
                    }
                    go(el.dataset.to);
                },
                resume() {
                    closeSheet();
                    go('live');
                },
                selDay(el) {
                    UI.selDay = +el.dataset.d;
                    render();
                },
                detail(el) {
                    go('workout', { wid: el.dataset.wid });
                },
                start(el) {
                    startWorkout(el.dataset.wid);
                },
                discardAndStart(el) {
                    S.live = null;
                    UI.rest = null;
                    save();
                    closeSheet();
                    startWorkout(el.dataset.wid);
                },
                exInfo(el) {
                    exerciseSheet(el.dataset.ex);
                },
                exHistory(el) {
                    exHistorySheet(el.dataset.ex);
                },
                closeSheet() {
                    closeSheet();
                },
                scrim(el, ev) {
                    if (ev.target === el) closeSheet();
                },
                openSession(el) {
                    openSessionSheet(el.dataset.id);
                },
                logRecovery() {
                    recoverySheet();
                },
                recAct(el) {
                    UI.sheet.act = el.dataset.v;
                    document
                        .querySelectorAll('[data-a="recAct"]')
                        .forEach((b) =>
                            b.setAttribute(
                                'aria-pressed',
                                b.dataset.v === UI.sheet.act,
                            ),
                        );
                },
                saveRecovery() {
                    const r = UI.sheet;
                    const m = num(r.min);
                    if (isNaN(m) || m <= 0) {
                        document
                            .getElementById('rec-min')
                            .classList.add('is-error');
                        return;
                    }
                    S.sessions.push({
                        id: uid('s'),
                        date: iso(addDays(mondayOf(TODAY), UI.selDay)),
                        workoutId: S.schedule[UI.selDay],
                        name:
                            (wById(S.schedule[UI.selDay]) || {}).name ||
                            'Récupération',
                        type: 'recovery',
                        durationSec: m * 60,
                        rpe: 1,
                        activity: r.act,
                        comment: r.comment,
                    });
                    save();
                    closeSheet();
                    render();
                    toast('Activité enregistrée');
                },

                /* séance musculation */
                toggleSet(el) {
                    const L = S.live;
                    const e = L.exercises[+el.dataset.e],
                        s = e.sets[+el.dataset.s];
                    s.done = !s.done;
                    L.cur = +el.dataset.e;
                    save();
                    const row = el.closest('tr');
                    row.classList.toggle('is-done', s.done);
                    el.setAttribute('aria-pressed', s.done);
                    if (s.done) {
                        const left = e.sets.filter((x) => !x.done).length;
                        const nextEx = L.exercises[L.cur + 1];
                        if (left > 0)
                            startRest(
                                e.rest,
                                'Prochaine : série ' +
                                    (e.sets.findIndex((x) => !x.done) + 1) +
                                    ' · ' +
                                    e.name,
                            );
                        else if (nextEx) {
                            startRest(e.rest, 'Ensuite : ' + nextEx.name);
                            L.cur = L.cur + 1;
                            setTimeout(() => {
                                const n = document.getElementById(
                                    'ex-' + L.cur,
                                );
                                if (n)
                                    n.scrollIntoView({
                                        behavior: 'smooth',
                                        block: 'start',
                                    });
                            }, 350);
                        } else {
                            UI.rest = null;
                            renderRest();
                            toast('Dernière série validée, bravo');
                        }
                    }
                    refreshLiveBits();
                },
                addSet(el) {
                    const e = S.live.exercises[+el.dataset.e];
                    const last = e.sets[e.sets.length - 1];
                    e.sets.push({
                        kg: last ? last.kg : 0,

                            err.segments = 'Ajoute au moins une phase.';

                },
                schedule(el) {
                    S.schedule[+el.dataset.d] = el.value || 'w-rest';
                    save();
                    render();
                    toast(DAY_NAMES[+el.dataset.d] + ' mis à jour');
                },
                libQuery(el) {
                    UI.libQuery = el.value;
                    const pos = el.selectionStart;
                    render();
                    const n = document.getElementById('libQ');
                    if (n) {
                        n.focus();
                        n.setSelectionRange(pos, pos);
                    }
                },
                pickQ(el) {
                    UI.pickQ = el.value;
                    const pos = el.selectionStart;
                    pickerSheet();
                    const n = document.getElementById('pickQ');
                    if (n) {
                        n.focus();
                        n.setSelectionRange(pos, pos);
                    }
                },
                draft(el) {
                    const f = el.dataset.f;
                    UI.draft[f] = f === 'duration' ? num(el.value) : el.value;
                    if (f === 'type') {
                        const d = UI.draft;
                        if (d.type === 'strength' && !d.exercises)
                            d.exercises = [];
                        if (d.type === 'run' && !d.segments)
                            d.segments = [
                                {
                                    label: 'Course',
                                    min: 20,
                                    vMin: 8,
                                    vMax: 8.5,
                                    incline: 1,
                                    kind: 'run',
                                },
                            ];
                        render();
                    }
                },
                draftEx(el) {
                    const v = num(el.value);
                    if (!isNaN(v))
                        UI.draft.exercises[+el.dataset.i][el.dataset.f] = v;
                },
                seg(el) {
                    const { arr, i } = segAt(el.dataset.p);
                    const f = el.dataset.f;
                    arr[i][f] =
                        f === 'label' || f === 'kind'
                            ? el.value
                            : num(el.value);
                },
                grpTimes(el) {
                    const v = Math.round(num(el.value));
                    if (v >= 1 && v <= 20)
                        UI.draft.segments[+el.dataset.i].times = v;
                },
                rec(el) {
                    UI.sheet[el.dataset.f] = el.value;
                },
                cx(el) {
                    const e = UI.sheet.draft,
                        f = el.dataset.f,
                        v = el.value;
                    if (f === 'cues' || f === 'mistakes')
                        e[f] = v
                            .split('\n')
                            .map((x) => x.trim())
                            .filter(Boolean);
                    else if (f === 'load') {
                        e.factor = +v;
                        e.bodyweight = v === '0';
                    } else if (f === 'perSide') e.perSide = v === '1';
                    else e[f] = v;
                },
                prof(el) {
                    UI.settingsDraft[el.dataset.f] = el.value;
                },
                profChk(el) {
                    UI.settingsDraft[el.dataset.f] = el.checked;
                },
            };
            const CHANGE_ONLY = { statsEx: 1, schedule: 1, cxImg: 1, draft: 0 };
            document.addEventListener('input', (ev) => {
                const el = ev.target;
                const k = el.dataset && el.dataset.in;
                if (!k || CHANGE_ONLY[k] || el.type === 'checkbox') return;
                if (k === 'draft' && el.dataset.f === 'type') return;
                INPUTS[k] && INPUTS[k](el);
            });
            document.addEventListener('change', (ev) => {
                const el = ev.target;
                const k = el.dataset && el.dataset.in;
                if (!k) return;
                if (k === 'cxImg') {
                    const file = el.files && el.files[0];
                    if (!file) return;
                    if (file.size > 2.5e6) {
                        UI.sheet.err = {
                            name: 'Image trop lourde (2,5 Mo max dans le prototype).',
                        };
                        drawCustomSheet();
                        return;
                    }
                    const r = new FileReader();
                    r.onload = () => {
                        UI.sheet.draft.image = r.result;
                        drawCustomSheet();
                    };
                    r.readAsDataURL(file);
                    return;
                }
                if (
                    CHANGE_ONLY[k] ||
                    el.type === 'checkbox' ||
                    (k === 'draft' && el.dataset.f === 'type')
                )
                    INPUTS[k] && INPUTS[k](el);
                if (k === 'draftEx' || k === 'seg' || k === 'grpTimes')
                    render(); // rafraîchit durées, contrôles et aperçu
            });
            document.addEventListener('keydown', (ev) => {
                if (ev.key === 'Escape' && document.querySelector('.scrim'))
                    closeSheet();
            });

            let resizeT;
            window.addEventListener('resize', () => {
                clearTimeout(resizeT);
                resizeT = setTimeout(() => {
                    if (PENDING_CHARTS.length) drawCharts();
                }, 150);
            });
            setInterval(() => {
                if (S.live) {
                    tickLive();
                }
                tickRest();
            }, 250);

            function routeFromHash() {
                const h = (location.hash || '').slice(1);
                const n = NAV.find((x) => x.hash === h);
                return n ? n.id : 'home';
            }
            window.addEventListener('hashchange', () => {
                const r = routeFromHash();
                if (ROUTE_TAB[UI.route] !== r) go(r);
            });
            UI.route = routeFromHash();
            render();
        </script>
    </body>
</html>
